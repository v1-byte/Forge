  <style>
    :root {
      --bg: #08080A;
      --surface: #111113;
      --surface-2: #1A1A1E;
      --surface-3: #222225;
      --border: #1E1E20;
      --border-hover: #2A2A2E;
      --text: #FAFAFA;
      --text-2: #E4E4E7;
      --muted: #A1A1AA;
      --muted-2: #71717B;
      --accent: #FF6A00;
      --accent-2: #FF3D9A;
      --green: #22C55E;
      --yellow: #FACC15;
      --red: #EF4444;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body, #root { height: 100%; background: var(--bg); color: var(--text); }
    body {
      font-family: Inter, system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }
    .code { font-family: 'JetBrains Mono', ui-monospace, monospace; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea { font-family: inherit; color: inherit; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #1E1E20; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #2A2A2E; }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.55; }
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      background: var(--bg);
      user-select: none;
    }

    /* ===== TOP BAR ===== */
    .topbar {
      height: 44px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 10px;
      border-bottom: 1px solid var(--border);
      background: var(--bg);
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }
    .traffic {
      display: none;
      gap: 7px;
      align-items: center;
    }
    @media (min-width: 768px) {
      .traffic { display: flex; }
      .mobile-only { display: none !important; }
    }
    @media (max-width: 767px) {
      .desktop-only { display: none !important; }
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      transition: filter 0.15s;
    }
    .dot:hover { filter: brightness(1.15); }
    .dot.red { background: #FF5F56; }
    .dot.yellow { background: #FFBD2E; }
    .dot.green { background: #27CA40; }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .brand-title {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .badge {
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .status-pill {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--muted-2);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 0 10px;
      height: 26px;
      background: #0F0F10;
    }
    @media (min-width: 900px) { .status-pill { display: flex; } }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: pulseGlow 2s ease infinite;
    }
    .run-btn {
      height: 30px;
      padding: 0 12px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF6A00, #FF8A00);
      color: white;
      font-size: 12px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.5), 0 4px 12px rgba(255,106,0,0.25);
      transition: filter 0.15s, transform 0.1s;
    }
    .run-btn:hover { filter: brightness(1.1); }
    .run-btn:active { transform: scale(0.96); }

    /* ===== MAIN LAYOUT ===== */
    .main {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    /* Activity Bar */
    .activity {
      width: 64px;
      background: var(--bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 8px 0;
      gap: 4px;
      flex-shrink: 0;
    }
    .act-btn {
      position: relative;
      width: 56px; height: 48px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      color: var(--muted-2);
      transition: all 0.15s;
    }
    .act-btn:hover { color: var(--muted); background: #111113; }
    .act-label { font-size: 8px; line-height: 10px; color: inherit; white-space: nowrap; letter-spacing: -.02em; }
    .act-btn.act-secondary { margin-top: 8px; }
    .act-btn.act-secondary + .act-btn.act-secondary { margin-top: 0; }
    .act-btn.active {
      background: var(--surface-2);
      color: white;
    }
    .act-btn.active::before {
      content: '';
      position: absolute;
      left: 0; top: 8px; bottom: 8px;
      width: 2.5px;
      border-radius: 999px;
      background: var(--accent);
    }
    .act-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
      padding-bottom: 8px;
    }
    .cmd-btn {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: #111113;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .cmd-btn:hover { color: white; border-color: var(--border-hover); }
    .avatar {
      width: 28px; height: 28px;
      border-radius: 50%;
      background: linear-gradient(135deg, #FF6A00, #FF3D9A);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    /* Sidebar */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s cubic-bezier(0.2,0,0,1);
    }
    .sidebar.collapsed { width: 0; overflow: hidden; border: none; }
    .explorer-controls { display:flex; align-items:center; gap:5px; margin-left:auto; }
    .explorer-toggle { display:flex; align-items:center; gap:6px; height:26px; padding:0 9px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border-hover); color:var(--text-2); font-size:10px; font-weight:700; }
    .explorer-toggle:hover { background:var(--surface-3); border-color:rgba(255,106,0,.5); }
    .explorer-toggle .toggle-dot { width:6px; height:6px; border-radius:50%; background:var(--green); box-shadow:0 0 0 3px rgba(34,197,94,.12); }
    .explorer-toggle.closed .toggle-dot { background:var(--muted-2); box-shadow:none; }
    .explorer-collapse { width:26px; height:26px; border-radius:6px; display:flex; align-items:center; justify-content:center; color:var(--muted); border:1px solid var(--border); }
    .explorer-collapse:hover { color:var(--text); background:var(--surface-2); }
    .explorer-fab-label { position:absolute; left:52px; top:50%; transform:translateY(-50%); white-space:nowrap; padding:6px 9px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border-hover); color:var(--text-2); font-size:10px; font-weight:700; box-shadow:0 8px 18px rgba(0,0,0,.35); pointer-events:none; }
    .sidebar-header {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 4px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .icon-btn {
      width: 22px; height: 22px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
      transition: all 0.15s;
    }
    .icon-btn:hover { background: var(--surface-2); color: var(--text); }
    .file-tree {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
    }
    .file-row {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 24px;
      padding: 0 10px;
      border-radius: 5px;
      margin: 0 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      transition: all 0.12s;
    }
    .file-row:hover { background: var(--surface-2); color: var(--text); }
    .file-row.active { background: var(--surface-3); color: var(--text); }
    .chevron {
      width: 10px; height: 10px;
      transition: transform 0.2s;
      flex-shrink: 0;
    }
    .chevron.open { transform: rotate(90deg); }
    .outline {
      border-top: 1px solid var(--border);
      padding: 10px;
    }
    .outline-title {
      font-size: 11px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: var(--muted-2);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .outline-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      padding: 2px 0;
    }
    .outline-item .bar { width: 12px; height: 2px; background: var(--accent); border-radius: 1px; }

    /* Editor Area */
    .editor-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }
    .tabs {
      height: 38px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
    }
    .tabs-scroll {
      flex: 1;
      display: flex;
      overflow-x: auto;
      height: 100%;
    }
    .tab {
      height: 100%;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      border-right: 1px solid var(--border);
      min-width: 130px;
      max-width: 200px;
      cursor: pointer;
      color: var(--muted);
      background: var(--surface);
      transition: all 0.12s;
      position: relative;
    }
    .tab:hover { background: var(--surface-2); color: var(--text); }
    .tab.active {
      background: var(--bg);
      color: var(--text);
    }
    .tab-name { font-size: 12px; truncate: true; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .tab-close {
      width: 16px; height: 16px;
      border-radius: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.5;
      transition: all 0.12s;
    }
    .tab:hover .tab-close { opacity: 1; }
    .tab-close:hover { background: var(--surface-3); }
    .tab-modified {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
    }
    .tabs-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 8px;
      border-left: 1px solid var(--border);
    }

    .copilot-bar {
      height: 40px;
      border-bottom: 1px solid var(--border);
      background: #0F0F10;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
      flex-shrink: 0;
    }
    .copilot-input-wrap {
      flex: 1;
      position: relative;
    }
    .copilot-input {
      width: 100%;
      height: 28px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 0 12px;
      font-size: 12px;
      outline: none;
      transition: border-color 0.15s;
    }
    .copilot-input:focus { border-color: rgba(255,106,0,0.5); }
    .copilot-input::placeholder { color: var(--muted-2); }
    .send-btn {
      height: 28px;
      padding: 0 12px;
      border-radius: 6px;
      background: var(--text);
      color: var(--bg);
      font-size: 12px;
      font-weight: 500;
      transition: filter 0.15s;
    }
    .send-btn:hover { filter: brightness(1.05); }

    .editor-content {
      flex: 1;
      overflow: auto;
      position: relative;
    }
    .code-view {
      display: flex;
      min-height: 100%;
    }
    .gutter {
      width: 48px;
      flex-shrink: 0;
      background: var(--bg);
      border-right: 1px solid rgba(30,30,32,0.5);
      padding: 12px 0;
      text-align: right;
      user-select: none;
    }
    .gutter-line {
      font-size: 12px;
      line-height: 20px;
      color: #3A3A3E;
      padding-right: 12px;
      font-family: 'JetBrains Mono', monospace;
    }
    .code-body {
      flex: 1;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 20px;
      color: var(--text-2);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'JetBrains Mono', monospace;
    }
    .suggestion-card {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .suggestion-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, #FF6A00, #FF3D9A);
    }
    .empty-state {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .empty-icon {
      width: 64px; height: 64px;
      border-radius: 16px;
      background: linear-gradient(135deg, #FF6A00, #FF3D9A);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(255,106,0,0.3);
      margin-bottom: 16px;
    }

    /* Panel (bottom) */
    .panel {
      height: 220px;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .panel.collapsed { height: 28px; }
    .panel-tabs {
      height: 36px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      border-bottom: 1px solid var(--border);
      gap: 4px;
      overflow-x: auto;
    }
    .panel-tab {
      height: 26px;
      padding: 0 12px;
      border-radius: 6px;
      font-size: 11px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--muted-2);
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .panel-tab:hover { color: var(--muted); background: var(--surface-2); }
    .panel-tab.active { background: var(--surface-3); color: var(--text); }
    .panel-count {
      padding: 0 5px;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 10px;
    }
    .panel-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--green);
      animation: pulseGlow 1.5s infinite;
    }
    .panel-body {
      flex: 1;
      overflow: auto;
      padding: 12px;
      font-size: 12px;
      line-height: 18px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
    }
    .term-line { margin-bottom: 2px; }
    .term-prompt { color: var(--accent); margin-right: 6px; }
    .term-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .term-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }
    .term-input::placeholder { color: #3A3A3E; }

    /* Right AI Panel */
    .ai-panel {
      width: 320px;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    @media (max-width: 1099px) {
      .ai-panel {
        position: fixed;
        right: 0; top: 44px; bottom: 0;
        width: min(88vw, 360px);
        z-index: 40;
        box-shadow: -12px 0 32px rgba(0,0,0,0.5);
        transform: translateX(100%);
        transition: transform 0.25s cubic-bezier(0.2,0,0,1);
      }
      .ai-panel.open { transform: translateX(0); }
      .ai-backdrop {
        position: fixed;
        inset: 0;
        top: 44px;
        background: rgba(0,0,0,0.5);
        z-index: 35;
        animation: fadeIn 0.2s;
      }
    }
    .ai-header {
      height: 44px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .back-btn {
      height: 36px;
      min-width: 36px;
      padding: 0 10px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .back-btn:hover { background: var(--surface-3); }
    .back-btn:active { transform: scale(0.94); }

    .model-select {
      margin: 12px;
      position: relative;
    }
    .model-trigger {
      width: 100%;
      height: 34px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      transition: border-color 0.15s;
    }
    .model-trigger:hover { border-color: var(--border-hover); }
    .model-dropdown {
      position: absolute;
      top: 40px; left: 0; right: 0;
      border-radius: 10px;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
      z-index: 20;
      overflow: hidden;
      animation: slideDown 0.18s ease;
    }
    .model-option {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.12s;
    }
    .model-option:hover { background: var(--surface-3); }

    .model-card {
      margin: 0 12px 10px;
      border-radius: 10px;
      background: #0F0F10;
      border: 1px solid var(--border);
      padding: 12px;
      transition: border-color 0.15s;
    }
    .model-card:hover { border-color: var(--border-hover); }
    .model-card-top {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .model-icon {
      width: 36px; height: 36px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FFB800, #FF8A00);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .model-name { font-size: 12px; font-weight: 600; }
    .model-meta { font-size: 10px; color: var(--muted-2); margin-top: 2px; }
    .progress-bar {
      height: 4px;
      border-radius: 999px;
      background: var(--surface-3);
      overflow: hidden;
      margin: 8px 0;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #FF6A00, #FF8A00);
      transition: width 0.3s;
    }
    .progress-shimmer {
      position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      animation: shimmer 1s infinite;
    }
    .model-actions {
      display: flex;
      gap: 6px;
    }
    .btn-sm {
      flex: 1;
      height: 28px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .btn-sm.secondary {
      background: var(--surface-3);
      color: var(--text);
    }
    .btn-sm.secondary:hover { background: #2A2A2E; }
    .btn-sm.primary {
      background: linear-gradient(135deg, #FF6A00, #FF8A00);
      color: white;
    }
    .btn-sm.primary:hover { filter: brightness(1.08); }
    .btn-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted-2);
    }
    .btn-icon:hover { color: white; }

    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      display: flex;
      gap: 8px;
      max-width: 92%;
    }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-avatar {
      width: 34px; height: 26px;
      border-radius: 8px;
      background: linear-gradient(135deg, #FF6A00, #FF3D9A);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .msg-bubble {
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      line-height: 1.5;
    }
    .msg.ai .msg-bubble {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text-2);
    }
    .msg.user .msg-bubble {
      background: var(--text);
      color: var(--bg);
    }
    .chat-input-area {
      padding: 12px;
      border-top: 1px solid var(--border);
    }
    .quick-cmds {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .quick-cmd {
      font-size: 10px;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--muted);
      transition: all 0.12s;
    }
    .quick-cmd:hover {
      color: white;
      border-color: rgba(255,106,0,0.35);
    }
    .chat-textarea {
      width: 100%;
      border-radius: 8px;
      background: #0F0F10;
      border: 1px solid var(--border);
      padding: 10px 12px;
      font-size: 12px;
      resize: none;
      outline: none;
      min-height: 56px;
      transition: border-color 0.15s;
    }
    .chat-textarea:focus { border-color: rgba(255,106,0,0.4); }
    .chat-textarea::placeholder { color: #3A3A3E; }
    .chat-send {
      position: absolute;
      right: 8px; bottom: 8px;
      width: 26px; height: 26px;
      border-radius: 6px;
      background: var(--text);
      color: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .chat-meta {
      margin-top: 8px;
      font-size: 10px;
      color: #3A3A3E;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Forge brand + AI model workspace */
    .brand-logo { height: 28px; width: auto; object-fit: contain; filter: drop-shadow(0 4px 10px rgba(255,106,0,.22)); }
    .toolkit { padding: 10px 10px 8px; border-bottom: 1px solid var(--border); background: linear-gradient(180deg, rgba(255,106,0,.06), transparent); }
    .toolkit-heading { display:flex; align-items:center; gap:7px; color:var(--text-2); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; margin-bottom:8px; }
    .toolkit-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .tool-btn { min-height:54px; padding:8px 7px; text-align:left; border:1px solid var(--border); background:rgba(255,255,255,.025); border-radius:8px; transition:.15s; }
    .tool-btn:hover { border-color:rgba(255,106,0,.5); background:var(--surface-2); transform:translateY(-1px); }
    .tool-btn strong { display:block; font-size:10px; color:var(--text-2); margin-top:5px; }
    .tool-btn span { display:block; font-size:9px; color:var(--muted-2); margin-top:2px; line-height:1.25; }
    .tool-section { margin-top:10px; padding-top:9px; border-top:1px solid var(--border); }
    .tool-section-title { color:var(--muted-2); font-size:9px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px; }
    .tool-row { display:flex; align-items:center; gap:7px; width:100%; padding:7px 6px; border-radius:6px; color:var(--muted); font-size:10px; text-align:left; }
    .tool-row:hover { background:var(--surface-2); color:var(--text); }
    .tool-row small { margin-left:auto; color:var(--muted-2); font-size:9px; }
    .logo-mark { height:18px; width:auto; object-fit:contain; }
    .copilot-logo { width:auto; object-fit:contain; display:inline-block; vertical-align:middle; flex-shrink:0; }
    .model-card .model-meta { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .workbench-switcher { display:flex; align-items:center; gap:4px; margin-left:8px; }
    .workspace-group { display:flex; align-items:center; gap:4px; padding:3px; border:1px solid var(--border); border-radius:8px; background:var(--surface); margin-left:8px; }
    .workspace-group-label { color:var(--muted-2); font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:0 5px; }
    .workspace-group-btn { height:27px; padding:0 10px; border-radius:6px; color:var(--muted); font-size:10px; font-weight:700; white-space:nowrap; }
    .workspace-group-btn:hover, .workspace-group-btn.active { color:var(--text); background:var(--surface-3); box-shadow:inset 0 -2px 0 var(--accent); }
    .group-panel { margin:10px 12px; padding:10px; border:1px solid var(--border); border-radius:9px; background:var(--surface); }
    .group-panel-title { display:flex; align-items:center; gap:7px; color:var(--text-2); font-size:11px; font-weight:700; margin-bottom:8px; }
    .group-panel-title small { color:var(--muted-2); font-weight:500; margin-left:auto; }
    .group-action-grid { display:grid; grid-template-columns:1fr 1fr; gap:5px; }
    .group-action { min-height:39px; padding:7px; text-align:left; border:1px solid var(--border); border-radius:7px; background:var(--surface-2); color:var(--text-2); }
    .group-action:hover { border-color:rgba(255,106,0,.5); background:var(--surface-3); }
    .group-action strong { display:block; font-size:10px; }
    .group-action span { display:block; margin-top:3px; color:var(--muted); font-size:9px; line-height:1.25; }
    .group-divider { height:1px; background:var(--border); margin:9px 0; }
    .category-strip { display:flex; gap:4px; overflow-x:auto; padding:4px; margin:0 12px 8px; border:1px solid var(--border); border-radius:7px; background:#0F0F10; }
    .category-btn { flex:1; min-width:62px; padding:6px 5px; border-radius:5px; color:var(--muted-2); font-size:9px; font-weight:700; white-space:nowrap; }
    .category-btn:hover, .category-btn.active { color:var(--text); background:var(--surface-3); box-shadow:inset 0 -2px 0 var(--accent); }
    .category-caption { display:flex; align-items:center; justify-content:space-between; margin:8px 12px 5px; color:var(--muted-2); font-size:9px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; }
    .category-caption small { color:var(--accent); font-size:8px; letter-spacing:0; text-transform:none; }
    .entry-kind { margin-left:auto; padding:2px 4px; border-radius:4px; background:var(--surface-3); color:var(--muted-2); font-size:8px; }
    .engine-chip { margin-left:auto; color:#FDBA74; font-size:8px; }
    .editor-mode-badge { margin-left:auto; padding:2px 5px; border-radius:4px; background:rgba(255,106,0,.12); color:#FDBA74; font-size:9px; font-weight:700; }
    .workbench-btn { height:26px; padding:0 9px; border:1px solid var(--border); border-radius:6px; color:var(--muted); font-size:10px; font-weight:600; background:var(--surface); }
    .workbench-btn:hover, .workbench-btn.active { color:var(--text); background:var(--surface-2); border-color:rgba(255,106,0,.45); }
    .workbench-btn.active { box-shadow:inset 0 -2px 0 var(--accent); }
    .zip-pill { display:inline-flex; align-items:center; gap:6px; padding:5px 8px; margin:0 12px 8px; border:1px dashed rgba(255,106,0,.45); border-radius:7px; color:var(--muted); font-size:10px; }
    .zip-pill button { color:var(--accent); font-size:10px; font-weight:700; }
    .training-card { margin:12px; padding:12px; border:1px solid rgba(255,106,0,.28); border-radius:10px; background:linear-gradient(135deg,rgba(255,106,0,.09),rgba(255,61,154,.04)); }
    .training-card h3 { font-size:12px; margin-bottom:4px; }
    .training-card p { color:var(--muted); font-size:10px; line-height:1.45; margin-bottom:10px; }
    .training-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
    .training-grid button { padding:8px 6px; border-radius:6px; background:var(--surface-2); color:var(--text-2); border:1px solid var(--border); font-size:10px; }
    .training-grid button:hover { border-color:var(--accent); }
    .code-editor { width:100%; min-height:520px; resize:none; border:0; outline:0; background:transparent; color:var(--text-2); font:13px/20px 'JetBrains Mono',monospace; white-space:pre; overflow:auto; tab-size:2; }
    .code-editor:focus { color:#fff; }
    .file-type-badge { margin-left:auto; padding:2px 5px; border-radius:4px; background:var(--surface-2); color:var(--muted-2); font:9px 'JetBrains Mono',monospace; }
    .editor-toolbar { height:30px; display:flex; align-items:center; gap:6px; padding:0 10px; border-bottom:1px solid var(--border); background:#0F0F10; color:var(--muted-2); font-size:10px; }
    .editor-toolbar button { padding:4px 7px; border-radius:5px; color:var(--muted); }
    .editor-toolbar button:hover { color:var(--text); background:var(--surface-2); }
    .model-browser { margin: 0 12px 10px; border:1px solid var(--border); border-radius:10px; background:#0F0F10; overflow:hidden; }
    .model-browser-header { display:flex; align-items:center; gap:8px; padding:9px 10px; border-bottom:1px solid var(--border); }
    .model-browser-title { font-size:11px; font-weight:700; color:var(--text-2); }
    .model-browser-path { color:var(--muted-2); font:10px 'JetBrains Mono',monospace; margin-top:2px; }
    .model-file-list { max-height:190px; overflow:auto; padding:5px; }
    .model-file-row { display:flex; align-items:center; gap:7px; width:100%; padding:7px 6px; border-radius:6px; text-align:left; color:var(--muted); font-size:10px; }
    .model-file-row:hover, .model-file-row.active { background:var(--surface-2); color:var(--text); }
    .model-file-row small { margin-left:auto; color:var(--muted-2); font-size:9px; }
    .model-browser-actions { display:flex; gap:6px; padding:8px; border-top:1px solid var(--border); }
    .model-browser-actions button { flex:1; height:27px; border-radius:6px; font-size:10px; font-weight:600; background:var(--surface-3); color:var(--text-2); }
    .model-browser-actions button.primary { background:linear-gradient(135deg,#FF6A00,#FF3D9A); color:#fff; }
    .model-preview { margin:0 12px 10px; padding:10px; border:1px solid rgba(255,106,0,.28); border-radius:9px; background:rgba(255,106,0,.05); }
    .model-preview h4 { font-size:10px; color:var(--accent); margin-bottom:6px; }
    .model-preview pre { white-space:pre-wrap; max-height:110px; overflow:auto; color:var(--muted); font:10px/1.45 'JetBrains Mono',monospace; }
    /* Status Bar */
    .statusbar {
      height: 24px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 12px;
      font-size: 11px;
      color: var(--muted-2);
      flex-shrink: 0;
      overflow-x: auto;
    }
    .status-item {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      white-space: nowrap;
      transition: all 0.12s;
    }
    .status-item:hover { background: var(--surface-2); color: var(--text); }

    /* Toast */
    .toasts {
      position: fixed;
      bottom: 40px;
      right: 16px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      min-width: 260px;
      max-width: 360px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      animation: toastIn 0.25s ease;
    }
    .toast.success { border-color: rgba(34,197,94,0.3); }
    .toast.error { border-color: rgba(239,68,68,0.3); background: #1A0F0F; }
    .toast-icon {
      width: 24px; height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 12px;
    }
    .toast.success .toast-icon { background: rgba(34,197,94,0.2); color: var(--green); }
    .toast.info .toast-icon { background: rgba(255,106,0,0.2); color: var(--accent); }
    .toast.error .toast-icon { background: rgba(239,68,68,0.2); color: var(--red); }

    /* Perbaikan tombol bertumpuk: toast naik di atas FAB AI (mobile/tablet) */
    @media (max-width: 1099px) {
      .toasts { bottom: 112px; right: 12px; left: 12px; align-items: flex-end; }
      .toast { min-width: 0; max-width: 100%; }
    }

    /* Command Palette */
    .palette-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      z-index: 80;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 18vh;
      animation: fadeIn 0.15s;
    }
    .palette {
      width: 100%;
      max-width: 540px;
      border-radius: 12px;
      background: var(--surface);
      border: 1px solid var(--border-hover);
      box-shadow: 0 16px 48px rgba(0,0,0,0.6);
      overflow: hidden;
      animation: slideDown 0.2s ease;
    }
    .palette-input-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      height: 48px;
      border-bottom: 1px solid var(--border);
    }
    .palette-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      font-size: 13px;
    }
    .palette-input::placeholder { color: var(--muted-2); }
    .palette-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px 0;
    }
    .palette-item {
      width: 100%;
      text-align: left;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background 0.12s;
    }
    .palette-item:hover { background: var(--surface-2); }
    .palette-item-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .palette-footer {
      height: 36px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--muted-2);
    }
    .kbd {
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      font-size: 10px;
    }

    /* Floating buttons (mobile) */
    .fab {
      position: fixed;
      z-index: 30;
      width: 44px; height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      transition: transform 0.15s;
    }
    .fab:active { transform: scale(0.92); }
    .fab-ai {
      right: 14px;
      bottom: 44px;
      width: 60px; height: 60px;
      background: #14141a;
      border: 2px solid var(--accent);
      box-shadow: 0 8px 24px rgba(255,106,0,0.35);
      overflow: hidden;
    }
    .fab-ai img { display:block; margin-top:4px; }
    .fab-explorer {
      left: 64px;
      bottom: 44px;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      color: var(--muted);
    }

    /* ===== FILE MANAGEMENT (menu File, dialog, aksi workspace) ===== */
    textarea, input[type="text"], input:not([type]) { user-select: text; -webkit-user-select: text; }
    .file-menu-btn { height: 30px; padding: 0 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-hover); color: var(--text-2); font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
    .file-menu-btn:hover { background: var(--surface-3); border-color: rgba(255,106,0,.5); }
    .fm-backdrop { position: fixed; inset: 0; z-index: 84; background: rgba(0,0,0,.25); }
    .file-menu { position: fixed; z-index: 85; top: 46px; left: 8px; width: min(290px, calc(100vw - 16px)); max-height: calc(100vh - 60px); overflow-y: auto; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border-hover); box-shadow: 0 14px 36px rgba(0,0,0,.6); padding: 5px 0; animation: slideDown .15s ease; }
    .fm-item { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; padding: 9px 14px; font-size: 13px; color: var(--text-2); }
    .fm-item:hover { background: var(--surface-3); color: #fff; }
    .fm-item small { color: var(--muted-2); font-size: 10px; }
    .fm-item.danger { color: #FCA5A5; }
    .fm-sep { height: 1px; background: var(--border); margin: 4px 0; }
    .ws-actions { display: flex; flex-wrap: wrap; gap: 5px; padding: 8px 10px; border-bottom: 1px solid var(--border); }
    .ws-btn { height: 26px; padding: 0 9px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--border-hover); color: var(--text-2); font-size: 11px; font-weight: 600; white-space: nowrap; }
    .ws-btn:hover { background: var(--surface-3); border-color: rgba(255,106,0,.5); }
    .ws-btn.primary { background: linear-gradient(135deg, #FF6A00, #FF8A00); border-color: transparent; color: #fff; }
    .ws-btn:disabled { opacity: .4; cursor: default; }
    .tab-save-btn { height: 24px; padding: 0 9px; border-radius: 6px; font-size: 11px; font-weight: 700; color: #fff; background: linear-gradient(135deg, #FF6A00, #FF8A00); white-space: nowrap; }
    .tab-save-btn:disabled { opacity: .35; background: var(--surface-3); color: var(--muted); }
    .editor-toolbar { flex-wrap: wrap; height: auto !important; min-height: 30px; padding-top: 2px; padding-bottom: 2px; }
    .editor-toolbar .save-now { color: #fff !important; background: rgba(255,106,0,.9); font-weight: 700; }
    .editor-toolbar .dirty { color: var(--yellow); font-size: 10px; }
    .file-row .row-more { margin-left: auto; width: 22px; height: 20px; border-radius: 4px; color: var(--muted-2); font-size: 14px; line-height: 1; opacity: .55; flex-shrink: 0; }
    .file-row .row-more:hover { opacity: 1; background: var(--surface-3); color: #fff; }
    .tree-empty { margin: 14px 12px; padding: 14px; border: 1px dashed var(--border-hover); border-radius: 8px; color: var(--muted-2); font-size: 11px; line-height: 1.5; }
    .dlg-overlay { position: fixed; inset: 0; z-index: 90; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; padding: 16px; animation: fadeIn .15s; }
    .dlg { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; border-radius: 12px; background: var(--surface); border: 1px solid var(--border-hover); box-shadow: 0 20px 50px rgba(0,0,0,.7); padding: 16px; }
    .dlg h3 { font-size: 14px; margin-bottom: 4px; }
    .dlg p { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 6px 0 10px; }
    .dlg label { display: block; font-size: 11px; color: var(--muted); margin: 10px 0 4px; }
    .dlg input, .dlg textarea { width: 100%; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border-hover); color: var(--text); padding: 9px 10px; font-size: 13px; outline: none; font-family: 'JetBrains Mono', monospace; }
    .dlg textarea { min-height: 220px; resize: vertical; white-space: pre; line-height: 1.45; }
    .dlg input:focus, .dlg textarea:focus { border-color: rgba(255,106,0,.6); }
    .dlg-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; margin-top: 14px; }
    .dlg-actions button { height: 34px; padding: 0 14px; border-radius: 8px; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--border-hover); color: var(--text-2); }
    .dlg-actions button.primary { background: linear-gradient(135deg, #FF6A00, #FF8A00); border-color: transparent; color: #fff; }
    .dlg-actions button.danger { background: #7F1D1D; border-color: transparent; color: #fff; }
    .busy-banner { position: fixed; z-index: 95; top: 52px; left: 50%; transform: translateX(-50%); padding: 8px 16px; border-radius: 999px; background: var(--surface-2); border: 1px solid rgba(255,106,0,.5); color: var(--text); font-size: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.5); animation: pulseGlow 1.2s infinite; }
    .ctx-backdrop { position: fixed; inset: 0; z-index: 69; }
    @media (max-width: 767px) {
      .sidebar { position: fixed; left: 52px; top: 44px; bottom: 24px; z-index: 45; width: min(82vw, 320px); box-shadow: 12px 0 32px rgba(0,0,0,.6); }
      .sidebar-backdrop { position: fixed; inset: 44px 0 24px 0; z-index: 44; background: rgba(0,0,0,.45); }
      .tab-save-btn { height: 28px; }
    }
    @media (min-width: 768px) { .sidebar-backdrop { display: none; } }

    /* Perbaikan tombol bertumpuk: topbar tidak menyusutkan tombol hingga saling menimpa */
    .topbar > * { flex-shrink: 0; }
    .topbar .brand { flex: 1 1 auto; min-width: 0; overflow: hidden; }
    .topbar .brand-logo { flex-shrink: 1; min-width: 0; }
    @media (max-width: 767px) {
      .topbar { gap: 6px; padding: 0 8px; }
      .topbar .run-btn { padding: 0 10px; }
      .topbar .file-menu-btn { padding: 0 9px; }
    }

    /* ===== Kejelasan editor & ikon pro ===== */
    .ft-ic { display:inline-flex; align-items:center; justify-content:center; min-width:22px; height:14px; padding:0 3px; border-radius:3px; font:700 8px/1 'JetBrains Mono',monospace; letter-spacing:-.01em; flex-shrink:0; }
    .editor-toolbar button, .workspace-group-btn, .save-now, .ws-btn, .tab-save-btn { display:inline-flex; align-items:center; gap:5px; }
    .editor-toolbar button { color:var(--text-2); }
    .editor-toolbar button:hover { color:#fff; background:var(--surface-2); }
    .editor-toolbar .save-now { color:#fff; }
    .group-action strong { display:flex; align-items:center; gap:6px; }
    .group-action strong svg { color:#FDBA74; }
    .group-action:hover strong svg { color:var(--accent); }
    .copilot-bar > div { display:flex; align-items:center; gap:6px; }
    .icon-btn svg, .explorer-collapse svg, .row-more svg, .cmd-btn svg, .tab-close svg { display:block; }
    .cmd-btn { gap:2px; }
    .statusbar .status-item { gap:5px; }
    .chat-send svg { display:block; }
    .palette-footer .kbd { display:inline-flex; align-items:center; }
    .panel-body .term-prompt { font-weight:700; }

    .file-menu-btn svg, .run-btn svg, .panel-tab svg { display:inline-block; }
    .activity .act-btn svg { display:block; }
    .tool-row svg, .model-file-row svg, .group-panel-title svg { flex-shrink:0; }
    /* Perbaikan tumpang tindih kiri-bawah */
    .activity { overflow: hidden; }
    .act-bottom { padding-bottom: 10px; flex-shrink: 0; }
    .avatar { flex-shrink: 0; }
    .empty-icon { background: #14141a; border: 1px solid rgba(255,106,0,.45); width: 96px; height: 96px; border-radius: 24px; overflow: hidden; }
    /* Context menu */
    .ctx-menu {
      position: fixed;
      z-index: 70;
      width: 200px;
      border-radius: 8px;
      background: var(--surface-2);
      border: 1px solid var(--border-hover);
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      padding: 4px 0;
      animation: slideDown 0.15s ease;
    }
    .ctx-item {
      width: 100%;
      text-align: left;
      padding: 7px 12px;
      font-size: 12px;
      color: var(--muted);
      transition: all 0.1s;
    }
    .ctx-item:hover { background: var(--surface-3); color: white; }
    .ctx-label {
      padding: 4px 12px;
      font-size: 10px;
      color: var(--muted-2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    /* Forge editor: theme tokens, accessible theme picker, and syntax-highlight overlay */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg:#F5F7FA; --surface:#FFFFFF; --surface-2:#EDF1F5; --surface-3:#E2E8F0;
      --border:#D9E0E8; --border-hover:#BCC7D4; --text:#101828; --text-2:#263445;
      --muted:#526174; --muted-2:#69788B; --accent:#D95700; --accent-2:#C22563;
      --green:#16834A; --yellow:#A66A00; --red:#C33232;
    }
    :root[data-theme="dark"] { color-scheme: dark; }
    .cmd-btn.theme-command { width:56px; height:42px; flex-direction:column; gap:1px; font-size:8px; }
    .theme-dismiss { position:fixed; inset:0; z-index:78; background:transparent; cursor:default; }
    .theme-picker { position:fixed; left:72px; bottom:78px; z-index:79; width:min(250px,calc(100vw - 88px)); padding:8px; border:1px solid var(--border-hover); border-radius:12px; background:var(--surface); box-shadow:0 16px 42px rgba(0,0,0,.38); }
    .theme-picker-title { padding:7px 9px 9px; color:var(--text); font-size:12px; font-weight:700; }
    .theme-picker-title span { float:right; color:var(--muted-2); font-size:9px; font-weight:400; }
    .theme-option { width:100%; display:flex; align-items:center; gap:9px; padding:8px; border-radius:8px; text-align:left; color:var(--text-2); }
    .theme-option:hover,.theme-option.selected { background:var(--surface-2); }
    .theme-swatch { width:24px; height:24px; display:grid; place-items:center; border:1px solid var(--border-hover); border-radius:7px; background:#09090B; }
    .theme-swatch.light { background:#F5F7FA; }
    .theme-swatch.system { background:linear-gradient(135deg,#09090B 0 50%,#F5F7FA 50%); }
    .theme-swatch i { width:8px; height:8px; border-radius:50%; background:var(--accent); }
    .theme-option-text { flex:1; display:flex; flex-direction:column; gap:2px; }
    .theme-option-text strong { font-size:11px; font-weight:600; }
    .theme-option-text small { color:var(--muted-2); font-size:9px; }
    .code-body { display:flex; flex-direction:column; min-width:0; padding:0; }
    .editor-code-surface { position:relative; flex:1; min-width:0; min-height:520px; overflow:hidden; background:var(--bg); }
    .syntax-highlight,.code-editor { position:absolute; inset:0; width:100%; height:100%; min-height:100%; margin:0; padding:12px 16px; border:0; font:13px/20px 'JetBrains Mono',monospace; white-space:pre; tab-size:2; }
    .syntax-highlight { z-index:1; overflow:auto; pointer-events:none; color:var(--text-2); scrollbar-width:none; }
    .syntax-highlight::-webkit-scrollbar { display:none; }
    .syntax-highlight code { font:inherit; color:inherit; }
    .code-editor { z-index:2; resize:none; outline:0; overflow:auto; background:transparent; color:transparent; -webkit-text-fill-color:transparent; caret-color:var(--text); }
    .code-editor:focus { color:transparent; -webkit-text-fill-color:transparent; }
    .code-editor::selection { background:rgba(77,139,245,.32); color:transparent; -webkit-text-fill-color:transparent; }
    .editor-code-surface.syntax-plain .code-editor,.editor-code-surface.syntax-plain .code-editor:focus { color:var(--text-2); -webkit-text-fill-color:var(--text-2); }
    .editor-toolbar { flex-wrap:wrap; height:auto; min-height:34px; padding-top:4px; padding-bottom:4px; background:var(--surface); }
    .editor-toolbar .file-type-badge { margin-left:0; margin-right:auto; }
    .editor-toolbar .editor-select { max-width:132px; height:25px; padding:0 6px; border:1px solid var(--border); border-radius:5px; background:var(--surface-2); color:var(--text-2); font:10px Inter,sans-serif; }
    .editor-toolbar .editor-setting-active { color:var(--accent); }
    .gutter { overflow:auto; scrollbar-width:none; }
    .gutter::-webkit-scrollbar { display:none; }
    .hljs-comment,.hljs-quote { color:#8492A6; font-style:italic; }
    .hljs-keyword,.hljs-selector-tag,.hljs-literal,.hljs-type,.hljs-built_in { color:#C792EA; }
    .hljs-string,.hljs-attr,.hljs-template-tag,.hljs-template-variable { color:#C3E88D; }
    .hljs-number,.hljs-regexp,.hljs-symbol,.hljs-bullet { color:#F78C6C; }
    .hljs-title,.hljs-title.function_,.hljs-title.class_,.hljs-function { color:#82AAFF; }
    .hljs-variable,.hljs-params,.hljs-property { color:#F07178; }
    .hljs-tag,.hljs-name,.hljs-selector-class,.hljs-selector-id { color:#F07178; }
    .hljs-meta,.hljs-operator,.hljs-punctuation { color:#89DDFF; }
    :root[data-theme="light"] .hljs-comment,:root[data-theme="light"] .hljs-quote { color:#68778A; }
    :root[data-theme="light"] .hljs-keyword,:root[data-theme="light"] .hljs-selector-tag,:root[data-theme="light"] .hljs-literal,:root[data-theme="light"] .hljs-type { color:#7B2CBF; }
    :root[data-theme="light"] .hljs-string,:root[data-theme="light"] .hljs-attr { color:#287A3D; }
    :root[data-theme="light"] .hljs-number,:root[data-theme="light"] .hljs-regexp { color:#B54708; }
    :root[data-theme="light"] .hljs-title,:root[data-theme="light"] .hljs-title.function_,:root[data-theme="light"] .hljs-function { color:#175CD3; }
    :root[data-theme="light"] .hljs-variable,:root[data-theme="light"] .hljs-params,:root[data-theme="light"] .hljs-property { color:#B4234A; }
    :root[data-theme="light"] .hljs-tag,:root[data-theme="light"] .hljs-name { color:#B4234A; }
    .plugin-dialog { width:min(520px,100%); }
    .plugin-list { max-height:min(52vh,420px); overflow:auto; border:1px solid var(--border); border-radius:9px; }
    .plugin-row { width:100%; min-height:48px; display:flex; align-items:center; gap:10px; padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; }
    .plugin-row:last-child { border-bottom:0; }
    .plugin-row:hover { background:var(--surface-2); }
    .plugin-status { width:22px; height:22px; display:grid; place-items:center; border:1px solid var(--border-hover); border-radius:6px; color:var(--muted-2); }
    .plugin-status.enabled { border-color:rgba(255,106,0,.4); background:rgba(255,106,0,.1); color:var(--accent); }
    .plugin-description { flex:1; display:flex; flex-direction:column; gap:3px; }
    .plugin-description strong { color:var(--text-2); font-size:11px; }
    .plugin-description small { color:var(--muted-2); font-size:9px; }
    .plugin-state { color:var(--muted-2); font-size:9px; }
    .plugin-state.enabled { color:var(--green); }
    .plugin-notice { display:flex; gap:7px; margin-top:10px; padding:9px; border-radius:8px; background:var(--surface-2); color:var(--muted); font-size:10px; line-height:1.45; }
    .plugin-notice svg { flex-shrink:0; color:var(--accent); }
    :root[data-theme="light"] .editor-toolbar { background:var(--surface); }
    :root[data-theme="light"] .gutter { border-color:var(--border); }
    :root[data-theme="light"] .gutter-line { color:#8A96A5; }
    :root[data-theme="light"] .empty-icon { background:#FFF7ED; }

      } catch (e) { reject(e); }
    }));
    const idbGet = async (key) => { const db = await openDb(); return new Promise((resolve, reject) => { const q = db.transaction("kv").objectStore("kv").get(key); q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error); }); };
    const idbSet = async (key, value) => { const db = await openDb(); return new Promise((resolve, reject) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(value, key); t.oncomplete = () => resolve(); t.onerror = () => reject(t.error); t.onabort = () => reject(t.error); }); };

    // Unduh/simpan ke perangkat. Memakai <a download>, bekerja di browser; di WebView Android butuh DownloadListener.
    const saveBlob = (name, blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name; a.style.display = "none";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    };

    const buildTree = (ws) => {
      const root = { children: [], map: {} };
      const ensureDir = (p) => {
        let cur = root, acc = "";
        for (const seg of p.split("/")) {
          acc = acc ? `${acc}/${seg}` : seg;
          let n = cur.map[seg];
          if (!n) { n = { id: `ws:${acc}`, path: acc, name: seg, type: "folder", children: [], map: {} }; cur.map[seg] = n; cur.children.push(n); }
          cur = n;
        }
        return cur;
      };
      (ws.dirs || []).forEach(d => d && ensureDir(d));
      Object.keys(ws.files).forEach(p => {
        const dir = parentOf(p);
        const parent = dir ? ensureDir(dir) : root;
        parent.children.push({ id: `ws:${p}`, path: p, name: baseName(p), type: "file", ext: extOf(p) });
      });
      const sortRec = (nodes) => { nodes.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === "folder" ? -1 : 1)); nodes.forEach(n => n.children && sortRec(n.children)); };
      sortRec(root.children);
      return root.children;
    };

    // ===== TOAST =====
    function useToast() {
      const [toasts, setToasts] = useState([]);
      const push = useCallback((msg, type = "info") => {
        const id = Math.random().toString(36).slice(2);
        setToasts(t => [...t, { id, msg, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2800);
      }, []);
      return { toasts, push };
    }

    // ===== MAIN APP =====
    function App() {
      const { toasts, push } = useToast();

      const [activity, setActivity] = useState("explorer");
      const [workspaceSearch, setWorkspaceSearch] = useState("");
      const [theme, setTheme] = useState(() => { try { return localStorage.getItem("forge-theme") || "dark"; } catch { return "dark"; } });
      const [themeOpen, setThemeOpen] = useState(false);
      const [syntaxEnabled, setSyntaxEnabled] = useState(true);
      const [languageOverrides, setLanguageOverrides] = useState({});
      const [pluginsOpen, setPluginsOpen] = useState(false);
      const [editorPlugins, setEditorPlugins] = useState(() => { try { const saved = JSON.parse(localStorage.getItem("forge-editor-plugins") || "null"); return Array.isArray(saved) ? saved : DEFAULT_EDITOR_PLUGINS; } catch { return DEFAULT_EDITOR_PLUGINS; } });
      const [toolMode, setToolMode] = useState("models");
      const [workbenchMode, setWorkbenchMode] = useState("code");
      const [zipName, setZipName] = useState("");
      const [zipEntries, setZipEntries] = useState([]);
      const [aiGroup, setAiGroup] = useState("files");
      const [aiEngineeringTab, setAiEngineeringTab] = useState("models");
      const [zipGroup, setZipGroup] = useState("all");
      const zipInputRef = useRef(null);
      const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 768);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [expanded, setExpanded] = useState({ root: true, "2": true, "4": true, "6": true });
      const [panelTab, setPanelTab] = useState("terminal");
      const [panelCollapsed, setPanelCollapsed] = useState(false);
      const [activeModel, setActiveModel] = useState("No model selected");
      const [modelDropdown, setModelDropdown] = useState(false);
      const [openedModel, setOpenedModel] = useState("");
      const [selectedModelFile, setSelectedModelFile] = useState(null);
      const [aiPanelOpen, setAiPanelOpen] = useState(false);
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [paletteQuery, setPaletteQuery] = useState("");
      const [ctxMenu, setCtxMenu] = useState(null);

      const [openTabs, setOpenTabs] = useState([]);
      const [activeTabId, setActiveTabId] = useState("2-1");
      const activeTab = useMemo(() => openTabs.find(t => t.id === activeTabId), [openTabs, activeTabId]);


      const [chatInput, setChatInput] = useState("");
      const [messages, setMessages] = useState([]);
      const [typing, setTyping] = useState(false);
      const [termLines, setTermLines] = useState(["Forge terminal connected — workspace kosong"]);
      const [termInput, setTermInput] = useState("");
      const [quantizeProgress, setQuantizeProgress] = useState({});
      const termRef = useRef(null);
      const editorTextareaRef = useRef(null);
      const syntaxHighlightRef = useRef(null);
      const editorGutterRef = useRef(null);
      const [systemStatus, setSystemStatus] = useState(null);
      const [activeJob, setActiveJob] = useState(null);

      // Workspace lokal (file nyata yang bisa dibuka, diedit, disimpan, diimpor, diekspor)
      const [ws, setWs] = useState({ files: {}, dirs: [] });
      const [wsReady, setWsReady] = useState(false);
      const editorLanguageSelection = activeTab ? (languageOverrides[activeTab.id] || "auto") : "auto";
      const editorResolvedLanguage = activeTab ? (editorLanguageSelection === "auto" ? languageForName(activeTab.name) : editorLanguageSelection) : "plaintext";
      const highlightedActiveCode = useMemo(() => makeHighlightedCode(activeTab?.content || "", editorResolvedLanguage, editorPlugins, syntaxEnabled), [activeTab?.content, editorResolvedLanguage, editorPlugins, syntaxEnabled]);
      const workspaceSearchResults = useMemo(() => {
        const query = workspaceSearch.trim().toLowerCase();
        if (!query) return [];
        const docs = new Map(Object.entries(ws.files || {}).filter(([, rec]) => rec?.kind === "text").map(([path, rec]) => [path, rec.content || ""]));
        openTabs.filter(tab => tab.source === "ws" && !tab.binary && !tab.readOnly && tab.path).forEach(tab => docs.set(tab.path, tab.content || ""));
        const results = [];
        for (const [path, content] of docs) {
          const lines = content.split("\n");
          for (let i = 0; i < lines.length; i++) {
            if (lines[i].toLowerCase().includes(query)) results.push({ path, line: i + 1, text: lines[i].trim().slice(0, 180) });
            if (results.length >= 100) return results;
          }
        }
        return results;
      }, [workspaceSearch, ws.files, openTabs]);
      const wsRef = useRef(ws); wsRef.current = ws;
      const [fileMenu, setFileMenu] = useState(false);
      const [dialog, setDialog] = useState(null);
      const [busy, setBusy] = useState("");
      const archiveRef = useRef(null);
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);
      const zipImportRef = useRef(null);
      const actionsRef = useRef({});
      const treeNodes = useMemo(() => buildTree(ws), [ws]);
      const fileCount = Object.keys(ws.files).length;

      // Muat workspace yang tersimpan
      useEffect(() => {
        idbGet("workspace").then(saved => { if (saved && saved.files) setWs({ files: saved.files, dirs: saved.dirs || [] }); }).catch(() => {}).finally(() => setWsReady(true));
      }, []);
      // Simpan workspace otomatis (debounce) setiap ada perubahan
      useEffect(() => {
        if (!wsReady) return;
        const t = setTimeout(() => { idbSet("workspace", ws).catch(() => {}); }, 400);
        return () => clearTimeout(t);
      }, [ws, wsReady]);

      useEffect(() => {
        const media = window.matchMedia("(prefers-color-scheme: light)");
        const apply = () => { document.documentElement.dataset.theme = theme === "system" ? (media.matches ? "light" : "dark") : theme; };
        apply();
        try { localStorage.setItem("forge-theme", theme); } catch {}
        media.addEventListener?.("change", apply);
        return () => media.removeEventListener?.("change", apply);
      }, [theme]);
      useEffect(() => { try { localStorage.setItem("forge-editor-plugins", JSON.stringify(editorPlugins)); } catch {} }, [editorPlugins]);
      // Keyboard shortcuts
      useEffect(() => {
        const onKey = (e) => {
          const mod = e.ctrlKey || e.metaKey;
          if (mod && e.key.toLowerCase() === "k") {
            e.preventDefault();
            setPaletteOpen(v => !v);
          }
          if (mod && e.key.toLowerCase() === "s") {
            e.preventDefault();
            if (e.shiftKey) actionsRef.current.saveAll?.(); else actionsRef.current.saveActive?.();
          }
          if (mod && e.key.toLowerCase() === "o") {
            e.preventDefault();
            fileInputRef.current?.click();
          }
          if (e.key === "Escape") {
            setPaletteOpen(false);
            setModelDropdown(false);
            setCtxMenu(null);
            setFileMenu(false);
            setDialog(d => (d ? null : d));
            if (window.innerWidth < 1100) setAiPanelOpen(false);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      // Auto focus terminal
      useEffect(() => {
        if (panelTab === "terminal" && !panelCollapsed && termRef.current) {
          termRef.current.focus();
        }
      }, [panelTab, panelCollapsed]);

      const notify = (msg, type = "info") => {
        push(msg, type);
        try { navigator.vibrate?.(10); } catch {}
      };

      const apiRequest = async (url, options = {}) => {
        const response = await fetch(url, { headers: { "content-type": "application/json", ...(options.headers || {}) }, ...options });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.error?.message || `API ${response.status}`);
        return data;
      };

      const runActiveFile = async () => {
        setPanelTab("output");
        if (!activeTab) { notify("Buka file dulu sebelum Run", "error"); setTermLines(l => [...l, "[Run] Tidak ada file aktif"].slice(-80)); return; }
        const ext = (activeTab.ext || activeTab.name.split(".").pop() || "").toLowerCase();
        if (!["js", "mjs", "py", "sh"].includes(ext)) { notify(`Run belum mendukung .${ext}`, "error"); setTermLines(l => [...l, `[Run] .${ext} belum didukung (js, mjs, py, sh)`].slice(-80)); return; }
        notify(`Menjalankan ${activeTab.name}...`, "info");
        setTermLines(l => [...l, `$ run ${activeTab.name}`].slice(-80));
        try {
          const response = await fetch("/api/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: activeTab.content, name: activeTab.name }) });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error?.message || `API ${response.status}`);
          const lines = String(data.output || "").split("\n").filter((x, i, a) => x || i < a.length - 1);
          setTermLines(l => [...l, ...lines, data.timedOut ? "[Run] Dihentikan: melewati batas waktu" : `[Run] selesai • exit ${data.exitCode} • ${data.ms} ms`].slice(-80));
          notify(data.ok ? "Run selesai" : "Run gagal", data.ok ? "success" : "error");
        } catch (error) {
          setTermLines(l => [...l, `[Run] ${error.message}`].slice(-80));
          notify(error.message, "error");
        }
      };

      useEffect(() => {
        apiRequest("/api/status").then(data => setSystemStatus(data)).catch(() => setSystemStatus({ unavailable: true }));
      }, []);

      const submitJob = async (type, payload = {}) => {
        try {
          const data = await apiRequest("/api/jobs", { method: "POST", body: JSON.stringify({ type, payload }) });
          setActiveJob(data.job);
          notify(`${type} job dibuat: ${data.job.id.slice(0, 8)}`, "success");
          const poll = async () => {
            try {
              const current = await apiRequest(`/api/jobs/${data.job.id}`);
              setActiveJob(current.job);
              if (["queued", "running"].includes(current.job.status)) setTimeout(poll, 350);
              else notify(`${type}: ${current.job.status}`, current.job.status === "completed" ? "success" : "error");
            } catch (error) { notify(`Job error: ${error.message}`, "error"); }
          };
          setTimeout(poll, 350);
          return data.job;
        } catch (error) { notify(`Gateway belum siap: ${error.message}`, "error"); return null; }
      };

      const classifyPath = (name = "") => {
        const value = name.toLowerCase();
        const ext = value.split(".").pop();
        const engine = value.match(/forge-(compiler|editor|inference|trainer|litgpt)/)?.[0] ||
          (value.includes("unsloth") ? "forge-trainer" : value.includes("litgpt") ? "forge-litgpt" : value.includes("llama") || value.includes("gguf") ? "forge-inference" : "");
        const isToken = /tokenizer|vocab|sentencepiece|token/.test(value);
        const isBinary = /\.(gguf|safetensors|bin|pt|pth|ckpt|onnx|so|dll|dylib|a|wasm|apk|zip)$/i.test(value);
        const isCode = /\.(c|cc|cpp|h|hpp|py|js|ts|tsx|jsx|java|kt|rs|go|swift|smali|sh)$/i.test(value);
        const isSystem = /(^|[/_.-])(config|manifest|settings|schema|package|cmake|docker|lock|env)([/_.-]|$)|\.(json|yaml|yml|toml|xml)$/i.test(value);
        let group = "files";
        if (engine && value.includes("forge-engine")) group = "engines";
        else if (isBinary || isToken) group = "machines";
        else if (isSystem) group = "system";
        else if (isCode) group = "files";
        return { group, engine, kind: isToken ? "token" : isBinary ? "binary" : isCode ? "code" : isSystem ? "system" : "file" };
      };

      const CATEGORY_LABELS = { all: "Semua", system: "System", files: "File", engines: "Engine", machines: "Mesin" };
      const CATEGORY_KIND_LABELS = { code: "kode", binary: "biner", token: "token", system: "config", file: "file" };

      // ====================== FILE MANAGER NYATA ======================
      const isMobile = () => window.innerWidth < 768;
      const showExplorer = () => { setActivity("explorer"); setSidebarOpen(true); };
      const needZip = () => { if (window.JSZip) return true; notify("Library ZIP belum termuat — buka aplikasi sekali dengan internet", "error"); return false; };

      const openWsFile = (path, rec = wsRef.current.files[path]) => {
        if (!rec) { notify(`File tidak ditemukan: ${path}`, "error"); return; }
        const id = `ws:${path}`, name = baseName(path), ext = extOf(path);
        const tab = rec.kind === "text"
          ? { id, source: "ws", path, name, ext, content: rec.content, saved: rec.content, modified: false }
          : { id, source: "ws", path, name, ext, binary: true, readOnly: true, saved: "", modified: false, content: `File biner — tidak bisa diedit sebagai teks.\npath: ${path}\nukuran: ${fmtSize(rec.data.length)}\n\nGunakan tombol Unduh untuk menyimpan file ini ke perangkat.` };
        setOpenTabs(tabs => tabs.find(t => t.id === id) ? tabs : [...tabs, tab]);
        setActiveTabId(id);
        if (isMobile()) setSidebarOpen(false);
      };

      const openFile = (file) => {
        if (file.type === "folder") { setExpanded(e => ({ ...e, [file.id]: !e[file.id] })); return; }
        openWsFile(file.path);
      };

      const commitFiles = (list, { dirs = [], expandAll = true } = {}) => {
        if (!list.length && !dirs.length) return;
        setWs(w => {
          const files = { ...w.files };
          list.forEach(([p, rec]) => { files[p] = rec; });
          return { files, dirs: [...new Set([...(w.dirs || []), ...dirs])] };
        });
        // file yang sedang terbuka dan ditimpa ikut diperbarui
        setOpenTabs(tabs => tabs.map(t => {
          const hit = t.source === "ws" && list.find(([p]) => p === t.path);
          return hit && hit[1].kind === "text" && !t.binary ? { ...t, content: hit[1].content, saved: hit[1].content, modified: false } : t;
        }));
        setExpanded(e => {
          const n = { ...e };
          [...list.map(([p]) => parentOf(p)), ...dirs].forEach(dir => {
            let acc = "";
            const segs = dir.split("/").filter(Boolean);
            (expandAll ? segs : segs.slice(0, 1)).forEach(s => { acc = acc ? `${acc}/${s}` : s; n[`ws:${acc}`] = true; });
          });
          return n;
        });
      };

      const markSaved = (id, content) => setOpenTabs(tabs => tabs.map(t => t.id === id ? { ...t, saved: content, modified: t.content !== content } : t));

      const saveTab = async (tab, silent = false) => {
        if (!tab) return false;
        if (tab.readOnly) { if (!silent) notify("File ini hanya-baca (biner/model). Gunakan Unduh.", "info"); return false; }
        const content = tab.content;
        if (tab.source === "zip") {
          if (!archiveRef.current) { notify("ZIP sumber sudah ditutup — tidak bisa menyimpan", "error"); return false; }
          archiveRef.current.file(tab.zipEntry, content);
          markSaved(tab.id, content);
          if (!silent) notify(`Disimpan ke dalam ZIP: ${tab.zipEntry} — tekan "Unduh ZIP" untuk mengekspor`, "success");
          return true;
        }
        const path = tab.path || tab.name;
        setWs(w => ({ ...w, files: { ...w.files, [path]: { kind: "text", content } } }));
        markSaved(tab.id, content);
        let server = false;
        if (systemStatus && !systemStatus.unavailable && content.length < 1500000) {
          try { await apiRequest("/api/files/write", { method: "POST", body: JSON.stringify({ path, content, allowNonCode: true }) }); server = true; } catch {}
        }
        if (!silent) notify(`Disimpan: ${path}${server ? " (+ server gateway)" : ""}`, "success");
        return true;
      };
      const saveActive = () => { if (!activeTab) { notify("Tidak ada file terbuka untuk disimpan", "error"); return Promise.resolve(false); } return saveTab(activeTab); };
      const saveAll = async () => {
        const dirty = openTabs.filter(t => t.modified && !t.readOnly);
        if (!dirty.length) { notify("Tidak ada perubahan yang perlu disimpan", "info"); return; }
        for (const t of dirty) await saveTab(t, true);
        notify(`${dirty.length} file disimpan`, "success");
      };

      const downloadTab = async (tab = activeTab) => {
        if (!tab) { notify("Tidak ada file terbuka", "error"); return; }
        try {
          let blob;
          if (tab.binary) blob = tab.source === "zip" ? await archiveRef.current.file(tab.zipEntry).async("blob") : new Blob([wsRef.current.files[tab.path].data]);
          else blob = new Blob([tab.content], { type: "text/plain;charset=utf-8" });
          saveBlob(tab.name, blob);
          notify(`Diunduh: ${tab.name}`, "success");
        } catch { notify("Gagal mengunduh file", "error"); }
      };

      const exportZip = async (folder = "") => {
        if (!needZip()) return;
        const w = wsRef.current;
        const keys = Object.keys(w.files).filter(p => !folder || p.startsWith(`${folder}/`));
        if (!keys.length) { notify("Workspace kosong — tidak ada yang diekspor", "error"); return; }
        setBusy("Membuat ZIP…");
        try {
          const live = {};
          openTabs.forEach(t => { if (t.source === "ws" && !t.binary) live[t.path] = t.content; });
          const zip = new window.JSZip();
          keys.forEach(p => { const rec = w.files[p]; zip.file(folder ? p.slice(folder.length + 1) : p, rec.kind === "text" ? (live[p] !== undefined ? live[p] : rec.content) : rec.data); });
          (w.dirs || []).forEach(d => { if (!folder) zip.folder(d); else if (d.startsWith(`${folder}/`)) zip.folder(d.slice(folder.length + 1)); });
          const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
          saveBlob(folder ? `${baseName(folder)}.zip` : "forge-workspace.zip", blob);
          notify(`ZIP dibuat: ${keys.length} file (${fmtSize(blob.size)})`, "success");
        } catch { notify("Gagal membuat ZIP", "error"); } finally { setBusy(""); }
      };

      const downloadArchive = async () => {
        if (!archiveRef.current || !needZip()) return;
        setBusy("Membuat ZIP…");
        try {
          openTabs.forEach(t => { if (t.source === "zip" && !t.readOnly) archiveRef.current.file(t.zipEntry, t.content); });
          const blob = await archiveRef.current.generateAsync({ type: "blob", compression: "DEFLATE" });
          saveBlob(`${zipName.replace(/\.zip$/i, "") || "archive"}-edited.zip`, blob);
          notify(`ZIP hasil edit diunduh (${fmtSize(blob.size)})`, "success");
        } catch { notify("Gagal membuat ZIP", "error"); } finally { setBusy(""); }
      };

      const handleOpenFiles = async (event) => {
        const files = [...(event.target.files || [])]; event.target.value = "";
        if (!files.length) return;
        setBusy(`Membuka ${files.length} file…`);
        try {
          const list = [];
          for (const f of files) { const p = normPath(f.name); if (p) list.push([p, toRec(await readAsU8(f))]); }
          commitFiles(list);
          showExplorer();
          const first = list.find(([, r]) => r.kind === "text") || list[0];
          if (first) openWsFile(first[0], first[1]);
          notify(`${list.length} file dibuka${list.length > 1 ? " (ditambahkan ke Explorer)" : ""}`, "success");
        } catch { notify("Gagal membaca file", "error"); } finally { setBusy(""); }
      };

      const handleOpenFolder = async (event) => {
        const files = [...(event.target.files || [])]; event.target.value = "";
        if (!files.length) return;
        setBusy(`Membaca folder (${files.length} file)…`);
        try {
          const list = []; let skipped = 0;
          for (const f of files) {
            const rel = normPath(f.webkitRelativePath || f.name);
            if (!rel) continue;
            if (SKIP_DIRS.test(rel)) { skipped++; continue; }
            if (list.length >= 5000) { skipped++; continue; }
            list.push([rel, toRec(await readAsU8(f))]);
          }
          commitFiles(list, { expandAll: false });
          showExplorer();
          notify(`${list.length} file dimuat dari folder${skipped ? ` (${skipped} dilewati: node_modules/.git/batas 5000)` : ""}`, "success");
        } catch { notify("Gagal membaca folder", "error"); } finally { setBusy(""); }
      };

      const importZipObject = async (zip, label) => {
        const all = Object.keys(zip.files);
        const fileNames = all.filter(n => !zip.files[n].dir);
        const total = fileNames.reduce((s, n) => s + (zip.files[n]._data?.uncompressedSize || 0), 0);
        if (total > MAX_ZIP_UNPACKED) { notify(`ZIP terlalu besar (${fmtSize(total)} saat diekstrak; batas ${fmtSize(MAX_ZIP_UNPACKED)})`, "error"); return; }
        const tops = new Set(all.map(n => normPath(n).split("/")[0]).filter(Boolean));
        const singleRoot = tops.size === 1 && fileNames.every(n => normPath(n).includes("/"));
        const wrap = normPath(label.replace(/\.zip$/i, "")) || "zip";
        const prefix = singleRoot ? "" : `${wrap}/`;
        const list = []; let skipped = 0;
        for (const n of fileNames) {
          const rel = normPath(n);
          if (!rel) continue;
          if (SKIP_DIRS.test(rel)) { skipped++; continue; }
          list.push([prefix + rel, toRec(await zip.files[n].async("uint8array"))]);
        }
        const dirs = all.filter(n => zip.files[n].dir).map(n => normPath(n)).filter(Boolean).filter(d => !SKIP_DIRS.test(d)).map(d => prefix + d);
        if (!list.length && !dirs.length) { notify("ZIP kosong — tidak ada file untuk diimpor", "error"); return; }
        commitFiles(list, { dirs, expandAll: false });
        showExplorer();
        notify(`${list.length} file diekstrak dari ${label} ke Explorer${skipped ? ` (${skipped} dilewati: node_modules/.git)` : ""}`, "success");
      };

      const handleImportZip = async (event) => {
        const file = event.target.files?.[0]; event.target.value = "";
        if (!file || !needZip()) return;
        setBusy(`Mengekstrak ${file.name}…`);
        try { await importZipObject(await window.JSZip.loadAsync(file), file.name); }
        catch { notify("ZIP tidak bisa dibaca atau rusak", "error"); } finally { setBusy(""); }
      };

      const extractArchive = async () => {
        if (!archiveRef.current) return;
        setBusy(`Mengekstrak ${zipName}…`);
        try { await importZipObject(archiveRef.current, zipName || "archive.zip"); } catch { notify("Gagal mengekstrak ZIP", "error"); } finally { setBusy(""); }
      };

      const uniquePath = (p) => {
        if (!wsRef.current.files[p]) return p;
        const dot = baseName(p).lastIndexOf(".");
        const dir = parentOf(p), name = baseName(p);
        const stem = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
        for (let i = 2; i < 1000; i++) { const c = `${dir ? dir + "/" : ""}${stem}-${i}${ext}`; if (!wsRef.current.files[c]) return c; }
        return p;
      };

      const openDialog = (cfg) => setDialog({ values: {}, ...cfg });
      const askNewFile = (dir = "") => openDialog({
        title: "File baru", message: dir ? `Dibuat di folder: ${dir}` : "Boleh memakai folder, mis. src/app.js",
        fields: [{ key: "path", label: "Nama file", placeholder: "contoh.js" }], values: { path: "" }, submitLabel: "Buat",
        onSubmit: (v) => {
          const p = normPath(`${dir ? dir + "/" : ""}${v.path || ""}`);
          if (!p) { notify("Nama file kosong", "error"); return false; }
          if (wsRef.current.files[p]) { notify("File sudah ada", "error"); return false; }
          const rec = { kind: "text", content: "" };
          commitFiles([[p, rec]]); showExplorer(); openWsFile(p, rec); notify(`File dibuat: ${p}`, "success");
          return true;
        },
      });
      const askNewFolder = (dir = "") => openDialog({
        title: "Folder baru", message: dir ? `Dibuat di dalam: ${dir}` : "Boleh bertingkat, mis. src/components",
        fields: [{ key: "path", label: "Nama folder", placeholder: "folder-baru" }], values: { path: "" }, submitLabel: "Buat",
        onSubmit: (v) => {
          const p = normPath(`${dir ? dir + "/" : ""}${v.path || ""}`);
          if (!p) { notify("Nama folder kosong", "error"); return false; }
          commitFiles([], { dirs: [p] }); showExplorer(); notify(`Folder dibuat: ${p}`, "success");
          return true;
        },
      });
      const askImportCode = () => openDialog({
        title: "Import Code", message: "Tempel kode, beri nama file, lalu simpan ke Explorer.",
        fields: [{ key: "name", label: "Nama file", placeholder: "kode-baru.js" }, { key: "code", label: "Kode", type: "textarea", placeholder: "// tempel kode di sini" }],
        values: { name: "kode-baru.js", code: "" }, submitLabel: "Import",
        extras: [{ label: "Tempel dari clipboard", keepOpen: true, onClick: () => { navigator.clipboard?.readText().then(t => setDialog(d => d ? { ...d, values: { ...d.values, code: t } } : d)).catch(() => notify("Clipboard diblokir — tempel manual di kotak kode", "info")); } }],
        onSubmit: (v) => {
          const name = normPath(v.name || "");
          if (!name) { notify("Nama file kosong", "error"); return false; }
          if (!String(v.code || "").trim()) { notify("Kode masih kosong", "error"); return false; }
          const p = uniquePath(name), rec = { kind: "text", content: String(v.code) };
