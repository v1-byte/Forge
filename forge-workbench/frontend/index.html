          commitFiles([[p, rec]]); showExplorer(); openWsFile(p, rec);
          notify(p === name ? `Kode diimpor: ${p}` : `Nama sudah ada — disimpan sebagai ${p}`, "success");
          return true;
        },
      });
      const askRename = (node) => openDialog({
        title: node.type === "folder" ? "Ganti nama / pindah folder" : "Ganti nama / pindah file", message: `Sekarang: ${node.path}`,
        fields: [{ key: "path", label: "Path baru" }], values: { path: node.path }, submitLabel: "Simpan",
        onSubmit: (v) => renamePath(node.path, v.path, node.type === "folder"),
      });
      const askDelete = (node) => openDialog({
        title: `Hapus ${node.type === "folder" ? "folder" : "file"}?`, message: `"${node.path}"${node.type === "folder" ? " beserta seluruh isinya" : ""} akan dihapus dari workspace. Tindakan ini tidak bisa dibatalkan.`,
        submitLabel: "Hapus", danger: true,
        onSubmit: () => { deletePath(node.path, node.type === "folder"); return true; },
      });
      const askClearWorkspace = () => openDialog({
        title: "Kosongkan workspace?", message: `${fileCount} file di Explorer akan dihapus. Ekspor ZIP dulu bila perlu.`, submitLabel: "Kosongkan", danger: true,
        onSubmit: () => { setWs({ files: {}, dirs: [] }); setOpenTabs(tabs => tabs.filter(t => t.source !== "ws")); notify("Workspace dikosongkan", "success"); return true; },
      });

      const renamePath = (oldP, rawNew, isFolder) => {
        const neu = normPath(rawNew);
        if (!neu) { notify("Nama kosong", "error"); return false; }
        if (neu === oldP) return true;
        if (isFolder && neu.startsWith(`${oldP}/`)) { notify("Folder tidak bisa dipindah ke dalam dirinya sendiri", "error"); return false; }
        const w = wsRef.current;
        const move = (p) => p === oldP ? neu : (isFolder && p.startsWith(`${oldP}/`)) ? neu + p.slice(oldP.length) : null;
        const files = {}, moved = [];
        for (const [p, r] of Object.entries(w.files)) { const m = move(p); if (m === null) files[p] = r; else moved.push([m, r]); }
        for (const [m, r] of moved) { if (files[m]) { notify(`Sudah ada: ${m}`, "error"); return false; } files[m] = r; }
        setWs({ files, dirs: (w.dirs || []).map(d => { const m = move(d); return m === null ? d : m; }) });
        setOpenTabs(tabs => tabs.map(t => { if (t.source !== "ws") return t; const m = move(t.path); return m ? { ...t, id: `ws:${m}`, path: m, name: baseName(m), ext: extOf(m) } : t; }));
        const cur = openTabs.find(x => x.id === activeTabId);
        if (cur && cur.source === "ws") { const m = move(cur.path); if (m) setActiveTabId(`ws:${m}`); }
        setExpanded(e => { const n = {}; Object.keys(e).forEach(k => { const m = k.startsWith("ws:") ? move(k.slice(3)) : null; n[m ? `ws:${m}` : k] = e[k]; }); return n; });
        notify(`Dipindah: ${oldP} → ${neu}`, "success");
        return true;
      };

      const deletePath = (p, isFolder) => {
        const inScope = (x) => x === p || (isFolder && x.startsWith(`${p}/`));
        setWs(w => { const files = {}; Object.entries(w.files).forEach(([k, r]) => { if (!inScope(k)) files[k] = r; }); return { files, dirs: (w.dirs || []).filter(d => !inScope(d)) }; });
        setOpenTabs(tabs => tabs.filter(t => !(t.source === "ws" && inScope(t.path))));
        notify(`Dihapus: ${p}`, "success");
      };

      const formatActive = () => {
        if (!activeTab || activeTab.readOnly) { notify("Tidak ada file teks aktif untuk diformat", "error"); return; }
        let out = activeTab.content;
        try {
          if (activeTab.ext === "json") out = `${JSON.stringify(JSON.parse(out), null, 2)}\n`;
          else if (out.trim()) out = out.replace(/\r\n/g, "\n").replace(/[ \t]+$/gm, "").replace(/\n*$/, "\n");
        } catch (e) { notify(`Format gagal: ${e.message}`, "error"); return; }
        if (out === activeTab.content) { notify("Sudah rapi", "info"); return; }
        setOpenTabs(tabs => tabs.map(t => t.id === activeTab.id ? { ...t, content: out, modified: out !== t.saved } : t));
        notify("Format selesai — tekan Save untuk menyimpan", "success");
      };
      const inspectActive = () => {
        if (!activeTab) { notify("Tidak ada file terbuka", "error"); return; }
        const lines = activeTab.content.split("\n").length;
        const bytes = activeTab.binary ? (activeTab.source === "zip" ? 0 : wsRef.current.files[activeTab.path]?.data?.length || 0) : new TextEncoder().encode(activeTab.content).length;
        const msg = `${activeTab.path || activeTab.zipEntry || activeTab.name} • ${activeTab.binary ? "biner" : `${lines} baris`} • ${fmtSize(bytes)} • .${activeTab.ext}`;
        setPanelTab("terminal"); setPanelCollapsed(false);
        setTermLines(l => [...l, `[Inspect] ${msg}`].slice(-80));
        notify(msg, "info");
      };
      const copyPath = (p) => { (navigator.clipboard?.writeText(p) || Promise.reject()).then(() => notify(`Path disalin: ${p}`, "success")).catch(() => notify(p, "info")); };

      actionsRef.current = { saveActive, saveAll };

      const doCloseTab = (id) => {
        const idx = openTabs.findIndex(t => t.id === id);
        const next = openTabs.filter(t => t.id !== id);
        setOpenTabs(next);
        if (activeTabId === id) setActiveTabId(next.length ? next[Math.max(0, idx - 1)].id : "");
      };
      const closeTab = (id, e) => {
        e?.stopPropagation();
        const tab = openTabs.find(t => t.id === id);
        if (!tab) return;
        if (tab.modified) {
          openDialog({
            title: "Perubahan belum disimpan", message: `"${tab.name}" punya perubahan yang belum disimpan.`, submitLabel: "Simpan & tutup",
            extras: [{ label: "Tutup tanpa simpan", danger: true, onClick: () => doCloseTab(id) }],
            onSubmit: async () => { await saveTab(tab, true); doCloseTab(id); return true; },
          });
          return;
        }
        doCloseTab(id);
      };
      const closeAllTabs = () => {
        if (!openTabs.length) return;
        const dirty = openTabs.filter(t => t.modified);
        if (dirty.length) {
          openDialog({
            title: "Perubahan belum disimpan", message: `${dirty.length} file punya perubahan yang belum disimpan.`, submitLabel: "Simpan semua & tutup",
            extras: [{ label: "Tutup tanpa simpan", danger: true, onClick: () => setOpenTabs([]) }],
            onSubmit: async () => { for (const t of dirty) await saveTab(t, true); setOpenTabs([]); return true; },
          });
          return;
        }
        setOpenTabs([]);
      };

      // pastikan tab aktif selalu valid; peringatkan sebelum menutup halaman bila ada yang belum disimpan
      useEffect(() => { if (openTabs.length && !openTabs.some(t => t.id === activeTabId)) setActiveTabId(openTabs[openTabs.length - 1].id); }, [openTabs, activeTabId]);
      const anyDirty = openTabs.some(t => t.modified);
      useEffect(() => {
        window.onbeforeunload = anyDirty ? (e) => { e.preventDefault(); e.returnValue = ""; return ""; } : null;
        return () => { window.onbeforeunload = null; };
      }, [anyDirty]);

      const switchActivity = (item) => {
        setActivity(item.id);
        if (item.id === "explorer") {
          setWorkbenchMode("code");
          setSidebarOpen(true);
        } else if (item.id === "ai-engineering") {
          setWorkbenchMode("ai-engineering");
          setAiEngineeringTab("models");
          setSidebarOpen(true);
        } else if (item.id === "copilot") {
          setAiPanelOpen(true);
          if (window.innerWidth < 768) setSidebarOpen(false);
        } else {
          setAiPanelOpen(false);
          setWorkbenchMode("code");
          setSidebarOpen(true);
        }
        notify(item.toast);
      };

      const runQuantize = (name) => {
        submitJob("quantize", { model: name, target: "Q4_K_M" });
        if (quantizeProgress[name] !== undefined) return;
        setQuantizeProgress(p => ({ ...p, [name]: 0 }));
        notify(`Mulai quantize ${name}...`);
        const iv = setInterval(() => {
          setQuantizeProgress(p => {
            const cur = (p[name] || 0) + Math.random() * 18;
            if (cur >= 100) {
              clearInterval(iv);
              setTimeout(() => {
                setQuantizeProgress(prev => {
                  const n = { ...prev };
                  delete n[name];
                  return n;
                });
                notify(`${name} berhasil di-quantize ke Q4_K_M`, "success");
              }, 400);
              return { ...p, [name]: 100 };
            }
            return { ...p, [name]: cur };
          });
        }, 280);
      };

      const sendChat = () => {
        if (!chatInput.trim()) return;
        const userMsg = { id: Date.now().toString(), role: "user", text: chatInput };
        setMessages(m => [...m, userMsg]);
        const q = chatInput;
        setChatInput("");
        setTyping(true);
        submitJob("inference", { prompt: q, file: activeTab?.name || null }).then(job => {
          setMessages(m => [...m, { id: (Date.now() + 1).toString(), role: "system", text: job ? `Inference job ${job.id.slice(0, 8)} dibuat. Output akan muncul di panel Output.` : "Inference tidak dijalankan: gateway atau engine belum tersedia." }]);
          setTyping(false);
        });
      };

      const runTerm = () => {
        if (!termInput.trim()) return;
        const cmd = termInput.toLowerCase();
        let out = `> ${termInput}`;
        if (cmd.includes("clear")) {
          setTermLines(["Forge terminal ready"]);
          setTermInput("");
          notify("Terminal dibersihkan");
          return;
        }
        if (cmd.startsWith("inference")) { submitJob("inference", { model: activeModel }); out = "> inference job submitted"; }
        else if (cmd.startsWith("compile")) { submitJob("compile", { model: activeModel }); out = "> compile job submitted"; }
        else if (cmd.startsWith("train")) { submitJob("training", { model: activeModel }); out = "> training job submitted"; }
        else if (cmd.includes("ls")) { apiRequest("/api/files?path=.").then(data => setTermLines(l => [...l, `> ${data.files.map(f => f.name).join("  ") || "workspace kosong"}`])); out = "> listing workspace..."; }
        else out = "> command tidak memiliki adapter: gunakan inference, compile, train, ls, atau clear";
        setTermLines(l => [...l, out].slice(-80));
        setTermInput("");
        notify(`Command: ${termInput.slice(0, 30)}`);
      };

      const setWorkbench = (mode) => {
        setWorkbenchMode(mode);
        if (mode === "code") { setActivity("explorer"); setAiPanelOpen(false); setSidebarOpen(true); notify("Code workspace aktif"); }
        if (mode === "ai-engineering") { setActivity("ai-engineering"); setAiEngineeringTab("models"); setSidebarOpen(true); setAiPanelOpen(false); notify("AI Engine workspace aktif"); }
        if (mode === "model") { setWorkbench("ai-engineering"); setAiEngineeringTab("models"); }
        if (mode === "training") { setWorkbench("ai-engineering"); setAiEngineeringTab("training"); setPanelTab("trainer"); }
        if (mode === "zip") { setActivity("explorer"); setSidebarOpen(true); notify("ZIP workspace aktif — pilih file ZIP"); }
      };
      const handleZipUpload = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        if (!window.JSZip) { notify("ZIP loader belum tersedia — buka aplikasi sekali dengan internet", "error"); return; }
        setBusy(`Membuka ${file.name}…`);
        try {
          const archive = await window.JSZip.loadAsync(file);
          archiveRef.current = archive;
          const entries = Object.values(archive.files).map(entry => ({ name: entry.name, dir: entry.dir, size: entry._data?.uncompressedSize || 0, zip: entry, classification: classifyPath(entry.name) }));
          setZipName(file.name);
          setZipEntries(entries);
          setZipGroup("all");
          showExplorer();
          notify(`${file.name} dibuka — ${entries.length} entry. Klik entry untuk mengedit.`, "success");
        } catch (error) { notify("ZIP tidak bisa dibaca atau rusak", "error"); } finally { setBusy(""); }
      };
      const openZipEntry = async (entry) => {
        if (entry.dir) return;
        try {
          const name = entry.name.split("/").pop() || entry.name;
          const ext = extOf(name);
          const id = `zip-${entry.name}`;
          const u8 = await entry.zip.async("uint8array");
          const rec = toRec(u8);
          const tab = rec.kind === "text"
            ? { id, source: "zip", zipEntry: entry.name, name, ext, content: rec.content, saved: rec.content, modified: false }
            : { id, source: "zip", zipEntry: entry.name, name, ext, binary: true, readOnly: true, saved: "", modified: false, content: `Entry biner di dalam ZIP.\nnama: ${entry.name}\nukuran: ${fmtSize(u8.length)}\n\nGunakan Unduh untuk menyimpan file ini, atau Ekstrak untuk memasukkan seluruh ZIP ke Explorer.` };
          setOpenTabs(tabs => tabs.find(t => t.id === id) ? tabs : [...tabs, tab]);
          setActiveTabId(id);
          if (isMobile()) setSidebarOpen(false);
        } catch { notify(`Gagal membaca ${entry.name}`, "error"); }
      };
      const startTraining = (recipe) => {
        setWorkbench("ai-engineering");
        setAiEngineeringTab("training");
        setPanelTab("trainer");
        setTermLines(lines => [...lines, `[Forge Trainer] ${recipe} submitted • model: ${activeModel}`]);
        submitJob("training", { recipe, model: activeModel, dataset: "workspace/dataset.jsonl" });
      };

      const openModelFolder = (modelName) => {
        const files = MODEL_FILES[modelName] || [];
        setOpenedModel(modelName);
        setSelectedModelFile(files[0]);
        setActiveModel(modelName);
        notify(`Folder model dibuka: ${modelName}`, "success");
      };
      const openModelFile = (file) => {
        setSelectedModelFile(file);
        const id = `model-${openedModel}-${file.name}`;
        if (!openTabs.find(t => t.id === id)) setOpenTabs(t => [...t, { id, source: "model", readOnly: true, name: file.name, content: file.content || "", saved: file.content || "", ext: file.name.split(".").pop(), modified: false }]);
        setActiveTabId(id);
        notify(`Membuka isi model: ${file.name}`, "success");
      };
      const modelFiles = MODEL_FILES[openedModel] || [];
      const renderModelBrowser = () => (
        <div className="model-browser">
          <div className="model-browser-header"><G name="folderOpen" size={16} color="#FF8A00" /><div><div className="model-browser-title">Model registry</div><div className="model-browser-path">Gateway-backed workspace</div></div></div>
          <div className="model-file-list">
            {modelFiles.length === 0 && <div style={{padding: "12px", color: "var(--muted-2)", fontSize: 10}}>Belum ada model terdaftar. Tambahkan model ke workspace atau scan melalui gateway.</div>}
            {modelFiles.map(file => <button key={file.name} className={`model-file-row ${selectedModelFile?.name === file.name ? "active" : ""}`} onClick={() => openModelFile(file)}><G name="layers" size={13} /><span>{file.name}</span><small>{file.size}</small></button>)}
          </div>
          <div className="model-browser-actions"><button onClick={() => notify(`${modelFiles.length} file model ditemukan`, "success")}>Scan folder</button><button className="primary" onClick={() => modelFiles[0] ? openModelFile(modelFiles[0]) : notify("Belum ada model terdaftar di workspace", "info")}>Buka isi model</button></div>
        </div>
      );

      const fileIcon = (file) => {
        if (file.type === "folder") return <G name={expanded[file.id] ? "folderOpen" : "folder"} size={14} color={expanded[file.id] ? "#FF8A00" : "#71717B"} />;
        if (file.name === "AndroidManifest.xml") return <FileTypeIcon ext="xml" />;
        return <FileTypeIcon ext={file.ext} />;
      };
      const tabIcon = (tab) => <FileTypeIcon ext={tab.ext} />;
      const renderTree = (nodes, depth = 0) =>
        nodes.map(node => (
          <div key={node.id}>
            <div
              className={`file-row ${activeTabId === node.id ? "active" : ""}`}
              style={{ paddingLeft: 8 + depth * 14 }}
              onClick={() => openFile(node)}
              onContextMenu={(e) => {
                e.preventDefault();
                const x = Math.max(4, Math.min(e.clientX, window.innerWidth - 210));
                const y = Math.max(4, Math.min(e.clientY, window.innerHeight - 230));
                setCtxMenu({ x, y, node });
              }}
            >
              {node.type === "folder" && (
                <span className={`chevron ${expanded[node.id] ? "open" : ""}`}>
                  <G name="chevronRight" size={11} />
                </span>
              )}
              {fileIcon(node)}
              <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{node.name}</span>
              <button className="row-more" title="Menu file" aria-label={`Menu ${node.name}`} onClick={(e) => {
                e.stopPropagation();
                const r = e.currentTarget.getBoundingClientRect();
                setCtxMenu({ x: Math.max(4, Math.min(r.left - 150, window.innerWidth - 210)), y: Math.max(4, Math.min(r.bottom + 2, window.innerHeight - 230)), node });
              }}><G name="moreH" size={14} /></button>
            </div>
            {node.type === "folder" && expanded[node.id] && node.children && (
              <div style={{ animation: "slideDown 0.2s ease" }}>
                {renderTree(node.children, depth + 1)}
              </div>
            )}
          </div>
        ));

      const AI_TOOLS = [
        { id: "models", title: "Model Manager", desc: "Import & edit model", icon: ActIcon("cube", 18), action: () => notify("Model Manager dibuka") },
        { id: "gguf", title: "GGUF Lab", desc: "Inspect • split • quantize", icon: ActIcon("layers", 18), action: () => { setPanelTab("output"); notify("GGUF Lab siap digunakan"); } },
        { id: "tokenizer", title: "Tokenizer", desc: "Encode • decode • vocab", icon: ActIcon("hash", 18), action: () => { setPanelTab("output"); notify("Tokenizer Inspector dibuka"); } },
        { id: "compile", title: "Compile", desc: "MLC • target device", icon: ActIcon("cpu", 18), action: () => { setPanelTab("output"); notify("Compile pipeline siap"); } },
        { id: "train", title: "Fine-tune", desc: "LoRA • QLoRA • full", icon: ActIcon("zap", 18), action: () => { setPanelTab("trainer"); notify("Training workspace dibuka"); } },
        { id: "serve", title: "Serve", desc: "API • local endpoint", icon: ActIcon("server", 18), action: () => { setPanelTab("inference"); notify("Inference server siap"); } },
      ];
      const runGroupAction = (label, panel = "output") => {
        if (label === "New File") return askNewFile();
        if (label === "Open Folder") return folderInputRef.current?.click();
        if (label === "Format") return formatActive();
        if (label === "Run / Build") return runActiveFile();
        setPanelTab(panel);
        const jobMap = { "Compile": "compile", "Convert": "convert", "Run Inference": "inference", "Serve API": "serve", "Quantize": "quantize", "Inspect GGUF": "inspect-model", "Tokenizer Inspector": "tokenize", "Encode / Decode": "tokenize", "Run & Debug": "inference", "Check Device": "inference", "Explain Code": "inference", "Fix / Optimize": "inference" };
        const type = jobMap[label];
        if (type) submitJob(type, { label, model: activeModel, file: activeTab?.name });
        else notify(`${label}: belum tersedia di versi ini (butuh engine/adapter native)`, "info");
      };
      const renderCodeToolkit = () => (
        <div className="group-panel">
          <div className="group-panel-title"><G name="code" size={13} /> Editor Kode <span className="editor-mode-badge">forge-editor transport</span></div>
          <div className="category-caption"><span>File & proyek</span><small>JS • TS • C++ • Python • HTML • CSS</small></div>
          <div style={{ padding: "8px 9px", color: "var(--muted-2)", fontSize: 10, lineHeight: 1.5 }}>
            Buka dan edit file dari Explorer. Search, Source Control, Run, dan format tersedia lewat navigasi atau toolbar editor—tidak ditampilkan ulang di sini.
          </div>
          <div className="category-caption"><span>Peran forge-editor</span><small>HTTP • WebSocket • proxy</small></div>
          <div style={{ padding: "0 9px 8px", color: "var(--muted-2)", fontSize: 9, lineHeight: 1.45 }}>
            Engine ini menangani konektivitas server/editor. UI editor, build tools, dan debugger bergantung pada aplikasi serta adapter yang dipasang.
          </div>
        </div>
      );
      const renderAiToolkit = () => {
        const groups = {
          system: [["Edit Config", "layers • RoPE"], ["Prompt Template", "chat format • stop tokens"], ["Runtime Config", "KV • batch • GPU"]],
          files: [["Open Model", "folder & files"], ["Model Compare", "diff metadata"], ["Merge LoRA", "adapter merge"]],
          engines: [["Compile", "MLC • target device"], ["Convert", "HF ↔ GGUF"], ["Serve", "local endpoint"]],
          machines: [["Inspect GGUF", "metadata"], ["Tokenizer", "vocab • encode"], ["Quantize", "Q4 • Q5 • Q8"]],
        };
        return <div className="group-panel">
          <div className="group-panel-title"><G name="sparkles" size={14} /> Edit AI <span className="editor-mode-badge">forge-inference</span></div>
          <div className="category-caption"><span>Bongkar isi AI</span><small>code • binary • token</small></div>
          <div className="category-strip">{Object.keys(CATEGORY_LABELS).filter(k => k !== "all").map(k => <button key={k} className={`category-btn ${aiGroup === k ? "active" : ""}`} onClick={() => setAiGroup(k)}>{CATEGORY_LABELS[k]}</button>)}</div>
          <div className="group-action-grid">
            {(groups[aiGroup] || []).map(([label,hint]) => <button key={label} className="group-action" onClick={() => runGroupAction(label, ["Tokenizer", "Inspect GGUF"].includes(label) ? "output" : "inference")}><strong><G name={actionIcon(label)} size={12} />{label}</strong><span>{hint}</span></button>)}
          </div>
        </div>;
      };
      const renderAiEngineeringToolkit = () => {
        const tabs = [
          ["models", "Models", "forge-inference"],
          ["runtime", "Runtime", "forge-inference"],
          ["tokens", "Tokenizer", "forge-inference"],
          ["engines", "Compiler", "forge-compiler"],
          ["machine", "Hardware", "CPU/GPU backends"],
          ["training", "Training", "forge-trainer / forge-litgpt"],
        ];
        const actions = {
          models: [["Open Model", "folder & files"], ["Inspect GGUF", "metadata • tensors"], ["Model Compare", "diff metadata"], ["Merge LoRA", "adapter merge"]],
          runtime: [["Runtime Config", "prompt • context • sampling"], ["Prompt Template", "chat • stop tokens"], ["Generation Config", "limits • structured output"], ["Serve API", "forge-inference endpoint"]],
          tokens: [["Tokenizer Inspector", "vocab • metadata"], ["Encode / Decode", "token preview"], ["Token Counter", "context budget"], ["Chat Template", "conversation format"]],
          engines: [["Compile", "forge-compiler / MLC"], ["Convert", "model checkpoint format"], ["Run Inference", "forge-inference"], ["Quantize", "model quantization"]],
          machine: [["CPU Runtime", "threads • memory"], ["CUDA / GPU", "offload • VRAM"], ["Metal / Vulkan", "backend target"], ["Check Device", "capability probe"]],
          training: [["LoRA Training", "adapter fine-tuning"], ["QLoRA 4-bit", "quantized fine-tuning"], ["Full Fine-tune", "full-parameter training"], ["Dataset / Checkpoint", "prepare • resume"]],
        };
        const current = tabs.find(([id]) => id === aiEngineeringTab) || tabs[0];
        return <div className="group-panel">
          <div className="group-panel-title"><G name="sparkles" size={14} /> AI Engine <span className="editor-mode-badge">inference • compiler • training</span></div>
          <div className="category-caption"><span>{current[1]}</span><small>{current[2]}</small></div>
          <div className="category-strip">{tabs.map(([id, label]) => <button key={id} className={`category-btn ${aiEngineeringTab === id ? "active" : ""}`} onClick={() => { setAiEngineeringTab(id); if (id === "training") setPanelTab("trainer"); }}>{label}</button>)}</div>
          <div className="group-action-grid">
            {actions[aiEngineeringTab].map(([label, hint]) => <button key={label} className="group-action" onClick={() => {
              if (aiEngineeringTab === "training" && ["LoRA Training", "QLoRA 4-bit", "Full Fine-tune"].includes(label)) return startTraining(label);
              const panel = ["Run Inference", "Serve API", "CPU Runtime", "CUDA / GPU", "Metal / Vulkan"].includes(label) ? "inference" : ["Run & Debug", "Compile", "Convert"].includes(label) ? "output" : "terminal";
              runGroupAction(label, panel);
            }}><strong><G name={actionIcon(label)} size={12} />{label}</strong><span>{hint}</span></button>)}
          </div>
          <div className="category-caption"><span>Engine availability</span><small>{systemStatus?.unavailable ? "gateway offline" : `${systemStatus?.hardware?.gpu || "CPU"} • ${systemStatus?.engines?.filter(e => e.available).length || 0}/5 available`}</small></div>
          <div style={{ padding: "7px 9px", color: "var(--muted-2)", fontSize: 9, lineHeight: 1.45 }}>Pengaturan lanjutan bergantung pada engine native, model, dan backend yang terpasang.</div>
        </div>;
      };

      const renderAiLabToolkit = () => (
        <div className="group-panel">
          <div className="group-panel-title"><G name="bug" size={13} /> AI Training <span className="editor-mode-badge">forge-trainer + forge-litgpt</span></div>
          <div className="group-action-grid">
            {[["LoRA Training","fast adapter"],["QLoRA 4-bit","low VRAM"],["Full Fine-tune","all weights"],["Dataset Builder","JSONL • chat"],["Run Inference","stream tokens"],["Evaluate","perplexity • bench"],["Serve API","OpenAI-compatible"],["Checkpoints","resume • export"]].map(([label,hint]) => <button key={label} className="group-action" onClick={() => label.includes("Training") || label.includes("Fine") || label.includes("QLoRA") ? startTraining(label) : runGroupAction(label, label === "Run Inference" || label === "Serve API" ? "inference" : "trainer")}><strong><G name={actionIcon(label)} size={12} />{label}</strong><span>{hint}</span></button>)}
          </div>
        </div>
      );

      const renderModelToolkit = () => (
        <div className="toolkit">
          <div className="toolkit-heading"><img className="logo-mark" src={FORGE_LOGO} alt="Forge" /> Model & Runtime Tools</div>
          <div className="toolkit-grid">
            {AI_TOOLS.map(t => { const ToolIcon = t.icon; return <button key={t.id} className="tool-btn" title={t.desc} onClick={t.action}><ToolIcon active={toolMode === t.id} /><strong>{t.title}</strong><span>{t.desc}</span></button>; })}
          </div>
          <div className="tool-section">
            <div className="tool-section-title">Edit model AI</div>
            {[
              ["GGUF metadata", "name • arch • context"], ["Llama config", "rope • layers • vocab"], ["Quantization", "Q4_K_M • Q8_0 • FP16"], ["Prompt template", "chat format • stop tokens"], ["Runtime", "KV cache • batch • GPU"],
            ].map(([label, hint]) => <button key={label} className="tool-row" onClick={() => notify(`${label} editor dibuka`)}><G name="cube" size={13} /><span>{label}</span><small>{hint}</small></button>)}
          </div>
        </div>
      );

      const commands = [
        { id: "inference", label: "Submit Inference Job", action: () => submitJob("inference", { model: activeModel }) },
        { id: "train", label: "Submit Training Job", action: () => submitJob("training", { model: activeModel }) },
        { id: "compile", label: "Submit Compile Job", action: () => submitJob("compile", { model: activeModel }) },
        { id: "models", label: "Open AI Engineering Models", action: () => { setWorkbench("ai-engineering"); setAiEngineeringTab("models"); } },
        { id: "tokens", label: "Open Tokenizer Tools", action: () => { setWorkbench("ai-engineering"); setAiEngineeringTab("tokens"); } },
        { id: "explorer", label: "Open Workspace Explorer", action: () => { setActivity("explorer"); setSidebarOpen(true); notify("Explorer dibuka"); } },
      ].filter(c => c.label.toLowerCase().includes(paletteQuery.toLowerCase()));

      return (
        <div className="app">
          {/* TOP BAR */}
          <div className="topbar">
            <div className="traffic desktop-only">
              <button className="dot red" title="Close" onClick={() => notify("Window close tidak tersedia pada browser", "info")} />
              <button className="dot yellow" title="Minimize" onClick={() => notify("Window minimized", "info")} />
              <button className="dot green" title="Maximize" onClick={() => notify("Window maximized", "info")} />
            </div>

            <button className="back-btn mobile-only" onClick={() => {
              if (aiPanelOpen) { setAiPanelOpen(false); notify("Panel AI ditutup"); }
              else if (activity !== "explorer") { setActivity("explorer"); notify("Kembali ke Explorer"); }
              else notify("Sudah di root");
            }}>
              <G name="chevronLeft" size={16} />
            </button>

            <div className="brand">
              <img className="brand-logo" src={FORGE_LOGO} alt="Forge" />
              <span className="brand-title desktop-only">Forge AI Studio</span>
              <span className="badge desktop-only">ON-DEVICE</span>
              <span className="mobile-only" style={{ fontSize: 12, fontWeight: 500 }}>{ACTIVITY.find(item => item.id === activity)?.label || activity}</span>
            </div>

            <button className="file-menu-btn" title="Menu File: buka, import, simpan, ekspor" onClick={() => setFileMenu(v => !v)}>
              <svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h6l4 4V13a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 3 13V2.5Z" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/><path d="M9 2.5V6.5h4" stroke="currentColor" strokeWidth="1.4" strokeLinejoin="round"/></svg>
              File <G name="chevronDown" size={10} />
            </button>
            <button className="workbench-btn desktop-only" style={{borderColor: sidebarOpen ? "rgba(34,197,94,.35)" : "rgba(255,106,0,.45)", color: sidebarOpen ? "#86EFAC" : "#FDBA74"}} title={sidebarOpen ? "Tutup Explorer" : "Buka Explorer"} onClick={() => { setSidebarOpen(v => !v); setActivity("explorer"); notify(sidebarOpen ? "Explorer ditutup — klik Buka Explorer untuk menampilkan lagi" : "Explorer dibuka", "info"); }}>{sidebarOpen ? "Tutup Explorer" : "Buka Explorer"}</button>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
            </div>
          </div>

          <div className="main">
            {/* ACTIVITY BAR */}
            <div className="activity">
              {ACTIVITY.map(item => {
                const ActiveIcon = item.icon;
                const isActive = activity === item.id;
                return (
                  <button
                    key={item.id}
                    className={`act-btn ${isActive ? "active" : ""} ${item.secondary ? "act-secondary" : "act-primary"}`}
                    aria-label={item.label}
                    title={item.id === "explorer" ? (sidebarOpen ? "Editor Kode — file dan proyek" : "Buka Editor Kode") : item.label}
                    onClick={() => switchActivity(item)}
                  >
                    <ActiveIcon active={isActive} />
                    <span className="act-label">{item.shortLabel}</span>
                  </button>
                );
              })}
              <div className="act-bottom">
                <button className="cmd-btn theme-command" title="Tema dan tampilan" aria-label="Tema dan tampilan" onClick={() => setThemeOpen(v => !v)}><G name="sun" size={14} /><span className="act-label">Theme</span></button>
                <button className="cmd-btn" title="Command Palette (Ctrl+K)" onClick={() => {
                  setPaletteOpen(true);
                  notify("Command Palette dibuka (Ctrl+K)");
                }}><G name="command" size={14} /></button>
                <div className="avatar">F</div>
              </div>
            </div>

            {themeOpen && <>
              <button className="theme-dismiss" aria-label="Tutup menu tema" onClick={() => setThemeOpen(false)} />
              <div className="theme-picker" role="dialog" aria-label="Pilih tema">
                <div className="theme-picker-title">Theme <span>Tampilan editor</span></div>
                {THEME_OPTIONS.map(option => <button key={option.id} className={`theme-option ${theme === option.id ? "selected" : ""}`} onClick={() => { setTheme(option.id); setThemeOpen(false); notify(`Theme ${option.label} diterapkan`); }}>
                  <span className={`theme-swatch ${option.id}`}><i /></span><span className="theme-option-text"><strong>{option.label}</strong><small>{option.detail}</small></span>{theme === option.id && <G name="check" size={14} color="var(--accent)" />}
                </button>)}
              </div>
            </>}
            {/* SIDEBAR */}
            {sidebarOpen && <div className="sidebar-backdrop" onClick={() => setSidebarOpen(false)} />}
            {sidebarOpen && (
              <div className={`sidebar ${sidebarCollapsed ? "collapsed" : ""}`}>
                <div className="sidebar-header">
                  <button className="explorer-toggle" onClick={() => { setSidebarOpen(v => !v); notify(sidebarOpen ? "Explorer ditutup — klik Explorer untuk membuka" : "Explorer dibuka", "info"); }} title={sidebarOpen ? "Tutup Explorer" : "Buka Explorer"}>
                    <span className={`toggle-dot ${sidebarOpen ? "" : "closed"}`} />
                    <span>{sidebarOpen ? "Explorer" : "Open Explorer"}</span>
                  </button>
                  <span className="sidebar-title" style={{marginLeft:2}}>{sidebarCollapsed ? "Collapsed" : "Files"}</span>
                  <div className="explorer-controls">
                    {!sidebarCollapsed && <><button className="icon-btn" title="New File" onClick={() => askNewFile()}><G name="filePlus" size={14} /></button><button className="icon-btn" title="New Folder" onClick={() => askNewFolder()}><G name="folderPlus" size={13} /></button></>}
                    <button className="explorer-collapse" title={sidebarCollapsed ? "Perluas Explorer" : "Ciutkan Explorer"} onClick={() => { setSidebarCollapsed(c => !c); notify(sidebarCollapsed ? "Explorer diperluas" : "Explorer diciutkan"); }}>
                      <svg width="13" height="13" viewBox="0 0 14 14" fill="none" style={{ transform: sidebarCollapsed ? "rotate(180deg)" : "none", transition: "0.2s" }}><path d="M9 3L5 7L9 11" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/></svg>
                    </button>
                  </div>
                </div>
                {!sidebarCollapsed && (
                  <>
                    <div className="ws-actions">
                      <button className="ws-btn primary" onClick={() => fileInputRef.current?.click()}><G name="file" size={12} /> Open File</button>
                      <button className="ws-btn" onClick={() => folderInputRef.current?.click()}><G name="folder" size={12} /> Open Folder</button>
                      <button className="ws-btn" onClick={() => zipImportRef.current?.click()}><G name="archive" size={12} /> Import ZIP</button>
                      <button className="ws-btn" onClick={askImportCode}><G name="code" size={12} /> Import Code</button>
                      <button className="ws-btn" disabled={!activeTab || !!activeTab.readOnly} onClick={saveActive}><G name="save" size={12} /> Save</button>
                      <button className="ws-btn" disabled={!fileCount} onClick={() => exportZip()}><G name="download" size={12} /> Export ZIP</button>
                    </div>
                    {activity === "search" && !sidebarCollapsed && <div style={{ padding: "10px 12px", borderBottom: "1px solid var(--border)" }}>
                      <div className="category-caption" style={{ margin: "0 0 8px" }}><span>Cari di Workspace</span><small>{workspaceSearchResults.length} hasil</small></div>
                      <input value={workspaceSearch} onChange={e => setWorkspaceSearch(e.target.value)} placeholder="Ketik teks atau nama kode…" autoFocus style={{ width: "100%", height: 34, padding: "0 10px", borderRadius: 7, border: "1px solid var(--border-hover)", background: "var(--surface-2)", color: "var(--text)", outline: "none", fontSize: 11 }} />
                      <div style={{ maxHeight: 220, overflowY: "auto", marginTop: 7 }}>
                        {!workspaceSearch.trim() && <div style={{ padding: "8px 2px", color: "var(--muted-2)", fontSize: 10 }}>Cari isi file teks yang tersimpan di workspace.</div>}
                        {workspaceSearch.trim() && workspaceSearchResults.length === 0 && <div style={{ padding: "8px 2px", color: "var(--muted-2)", fontSize: 10 }}>Tidak ada hasil yang cocok.</div>}
                        {workspaceSearchResults.map((result, i) => <button key={`${result.path}:${result.line}:${i}`} onClick={() => { setActivity("explorer"); setWorkbenchMode("code"); openWsFile(result.path); }} style={{ width: "100%", display: "block", textAlign: "left", padding: "7px 6px", borderBottom: "1px solid var(--border)", color: "var(--text-2)", fontSize: 9 }}>
                          <strong style={{ display: "block", color: "var(--accent)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{result.path}:{result.line}</strong>
                          <span style={{ display: "block", marginTop: 3, color: "var(--muted-2)", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{result.text || "(baris kosong)"}</span>
                        </button>)}
                      </div>
                    </div>}
                    {(activity === "models" || activity === "gguf" || activity === "tokenizer" || activity === "compile" || activity === "train" || activity === "serve") && renderModelToolkit()}
                    {workbenchMode === "code" && activity === "explorer" && renderCodeToolkit()}
                    {workbenchMode === "ai-engineering" && renderAiEngineeringToolkit()}
                    {zipName && <div className="zip-pill" style={{ flexWrap: "wrap" }}><FileTypeIcon ext="zip" /><span>{zipName} • {zipEntries.length} entries</span><button onClick={downloadArchive}>Unduh ZIP</button><button onClick={extractArchive}>Ekstrak</button><button onClick={() => { setZipName(""); setZipEntries([]); archiveRef.current = null; }}>Clear</button></div>}
                    {zipEntries.length > 0 && <>
                      <div className="category-caption"><span>Isi archive</span><small>{zipEntries.length} entry</small></div>
                      <div className="category-strip">{Object.keys(CATEGORY_LABELS).map(k => <button key={k} className={`category-btn ${zipGroup === k ? "active" : ""}`} onClick={() => setZipGroup(k)}>{CATEGORY_LABELS[k]}</button>)}</div>
                      <div className="model-file-list" style={{borderBottom:"1px solid var(--border)", maxHeight:180}}>{zipEntries.filter(entry => zipGroup === "all" || entry.classification?.group === zipGroup).map(entry => <button key={entry.name} className="model-file-row" onClick={() => openZipEntry(entry)}><FileTypeIcon ext="zip" /><span>{entry.name}</span><small className="entry-kind">{entry.dir ? "folder" : CATEGORY_KIND_LABELS[entry.classification?.kind] || "file"}</small><small className="engine-chip">{entry.classification?.engine || "Forge"}</small></button>)}</div>
                    </>}
                    <div className="file-tree">
                      <div style={{ padding: "4px 14px", fontSize: 11, letterSpacing: "0.05em", textTransform: "uppercase", color: "#71717B", fontWeight: 500 }}>
                        forge-workspace
                      </div>
                      {renderTree(treeNodes)}
                      {treeNodes.length === 0 && <div className="tree-empty">Workspace masih kosong. Gunakan <b>Open File</b>, <b>Open Folder</b>, <b>Import ZIP</b>, atau <b>Import Code</b> di atas — atau menu <b>File</b> di pojok kiri atas.</div>}
                      <div style={{ margin: "16px 12px 0", borderRadius: 8, background: "#1A1A1E", border: "1px solid #1E1E20", padding: 12 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                          <CopilotLogo size={14} />
                          <span style={{ fontSize: 11, fontWeight: 600 }}>Copilot Context</span>
                        </div>
                        <div style={{ fontSize: 11, color: "#A1A1AA", lineHeight: 1.4 }}>{fileCount} file di workspace{openTabs.some(t => t.modified) ? " • ada perubahan belum disimpan" : ""}</div>
                        <div style={{ marginTop: 8, height: 4, borderRadius: 999, background: "#222225", overflow: "hidden" }}>
                          <div style={{ height: "100%", width: "84%", background: "linear-gradient(90deg,#FF6A00,#FF3D9A)" }} />
                        </div>
                      </div>
                    </div>
                    <div className="outline">
                      <div className="outline-title">Outline • {activeTab?.name || "—"}</div>
                      <div className="outline-item"><span className="bar" /> {activeTab ? "Symbols loaded from active file" : "No file symbols"}</div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* EDITOR */}
            <div className="editor-area">
              <div className="tabs">
                <div className="tabs-scroll">
                  {openTabs.map(tab => (
                    <div
                      key={tab.id}
                      className={`tab ${tab.id === activeTabId ? "active" : ""}`}
                      onClick={() => { setActiveTabId(tab.id); notify(`Tab aktif: ${tab.name}`); }}
                      onMouseDown={e => { if (e.button === 1) closeTab(tab.id, e); }}
                    >
                      {tabIcon(tab)}
                      <span className="tab-name">{tab.name}</span>
                      {tab.modified && <span className="tab-modified" />}
                      <button className="tab-close" onClick={e => closeTab(tab.id, e)}>
                        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M1 1L9 9M9 1L1 9" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/></svg>
                      </button>
                    </div>
                  ))}
                </div>
                <div className="tabs-actions">
                  <button className="icon-btn" style={{ width: "auto", padding: "0 6px", fontSize: 10, fontWeight: 700 }} title="Simpan semua (Ctrl+Shift+S)" onClick={saveAll}>All</button>
                  <button className="icon-btn" title="Tutup semua tab" onClick={closeAllTabs}><G name="x" size={12} /></button>
                </div>
              </div>

              <div className="editor-content">
                {activeTab ? (
                  <div className="code-view">
                    <div className="gutter" ref={editorGutterRef}>
                      {activeTab.content.split("\n").map((_, i) => (
                        <div key={i} className="gutter-line">{i + 1}</div>
                      ))}
                    </div>
                    <div className="code-body">
                      <div className="editor-toolbar">
                        <span className="file-type-badge">{activeTab.ext?.toUpperCase() || "TEXT"}</span>
                        {!activeTab.readOnly && <button className="save-now" onClick={saveActive}><G name="save" size={12} /> Save</button>}
                        <button onClick={() => downloadTab(activeTab)}><G name="download" size={12} /> Unduh</button>
                        {!activeTab.readOnly && <button onClick={formatActive}><G name="wand" size={12} /> Format</button>}
                        {!activeTab.readOnly && <button onClick={runActiveFile}><G name="play" size={12} /> Run</button>}
                        <button onClick={inspectActive}><G name="search" size={12} /> Inspect</button>
                        <select className="editor-select" aria-label="Bahasa editor" title="Pilih bahasa syntax" value={editorLanguageSelection} onChange={e => setLanguageOverrides(prev => ({ ...prev, [activeTab.id]: e.target.value }))}>
                          <option value="auto">Auto: {editorResolvedLanguage === "plaintext" ? "Text" : editorResolvedLanguage}</option>
                          <option value="plaintext">Plain text</option>
                          {EDITOR_LANGUAGES.map(lang => { const pack = pluginForLanguage(lang.id); const enabled = editorPlugins.includes(lang.pluginId); return <option key={lang.id} value={lang.id} disabled={!enabled}>{lang.label}{enabled ? "" : " (plugin off)"}</option>; })}
                        </select>
                        <button className={syntaxEnabled ? "editor-setting-active" : ""} aria-pressed={syntaxEnabled} title="Aktif/nonaktifkan syntax highlighting" onClick={() => setSyntaxEnabled(v => !v)}><G name="code" size={12} /> Syntax {syntaxEnabled ? "On" : "Off"}</button>
                        <button title="Kelola plugin bahasa editor" onClick={() => setPluginsOpen(true)}><G name="package" size={12} /> Plugins</button>
                        {activeTab.modified && <span className="dirty">● belum disimpan</span>}
                        {activeTab.source === "zip" && <span className="editor-mode-badge">di dalam ZIP</span>}
                        <span className="editor-mode-badge">{classifyPath(activeTab.name).group} • {CATEGORY_KIND_LABELS[classifyPath(activeTab.name).kind]}</span>
                      </div>
                      <div className={`editor-code-surface ${syntaxEnabled ? "" : "syntax-plain"}`}>
                        {syntaxEnabled && <pre className="syntax-highlight" ref={syntaxHighlightRef} aria-hidden="true"><code dangerouslySetInnerHTML={{ __html: highlightedActiveCode }} /></pre>}
                        <textarea ref={editorTextareaRef} className="code-editor" spellCheck="false" readOnly={!!activeTab.readOnly} value={activeTab.content} onScroll={e => { const top = e.currentTarget.scrollTop, left = e.currentTarget.scrollLeft; if (syntaxHighlightRef.current) { syntaxHighlightRef.current.scrollTop = top; syntaxHighlightRef.current.scrollLeft = left; } if (editorGutterRef.current) editorGutterRef.current.scrollTop = top; }} onChange={e => { const v = e.target.value; setOpenTabs(tabs => tabs.map(t => t.id === activeTab.id ? { ...t, content: v, modified: v !== t.saved } : t)); }} />
                      </div>
                      <div className="suggestion-card">
                        <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 11, color: "#A1A1AA", marginBottom: 6 }}>
                          <CopilotLogo size={14} /> Copilot suggestion
                        </div>
                        <div className="code" style={{ fontSize: 12, color: "#A1A1AA" }}>// Forge suggests: inspect, format, run, or optimize this file</div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="empty-state">
                    <div className="empty-icon"><CopilotLogo size={84} /></div>
                    <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-0.02em" }}>{workbenchMode === "ai-engineering" ? "AI Engine Workspace" : "Editor Kode"}</div>
                    <div style={{ fontSize: 13, color: "var(--muted)", marginTop: 8, maxWidth: 320, lineHeight: 1.6 }}>
                      {workbenchMode === "ai-engineering" ? "Pilih model atau buka pengaturan runtime dari menu AI Engine." : "Belum ada file terbuka. Gunakan menu File atau Explorer untuk membuka proyek."}
                    </div>
                  </div>
                )}
              </div>

              {/* BOTTOM PANEL */}
              <div className={`panel ${panelCollapsed ? "collapsed" : ""}`}>
                <div className="panel-tabs">
                  {[
                    { id: "problems", label: "Problems", count: 2 },
                    { id: "output", label: "Output" },
                    { id: "terminal", label: "Terminal" },
                    { id: "inference", label: "Inference", dot: true },
                    { id: "trainer", label: "Trainer" },
                  ].map(t => (
                    <button
                      key={t.id}
                      className={`panel-tab ${panelTab === t.id ? "active" : ""}`}
                      onClick={() => {
                        setPanelTab(t.id);
                        setPanelCollapsed(false);
                        notify(`Panel ${t.label} aktif`);
                      }}
                    >
                      {t.label}
                      {t.count && <span className="panel-count">{t.count}</span>}
                      {t.dot && <span className="panel-dot" />}
                    </button>
                  ))}
                  <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
                    <button className="icon-btn" style={{ width: 24, height: 24 }} onClick={() => {
                      setTermLines(["Forge terminal ready"]);
                      notify("Panel dibersihkan");
                    }}>Clear</button>
                    <button className="icon-btn" style={{ width: 24, height: 24 }} onClick={() => {
                      setPanelCollapsed(c => !c);
                      notify(panelCollapsed ? "Panel diperluas" : "Panel diciutkan");
                    }}><G name={panelCollapsed ? "chevronUp" : "chevronDown"} size={13} /></button>
                  </div>
                </div>
                {!panelCollapsed && (
                  <div className="panel-body">
                    {panelTab === "terminal" && (
                      <>
                        {termLines.map((line, i) => (
                          <div key={i} className="term-line">
                            {i > 0 && <span className="term-prompt">❯</span>}
                            {line}
                          </div>
                        ))}
                        <div className="term-input-row">
                          <span className="term-prompt">❯</span>
                          <input
                            ref={termRef}
                            className="term-input"
                            value={termInput}
                            onChange={e => setTermInput(e.target.value)}
                            onKeyDown={e => { if (e.key === "Enter") runTerm(); }}
                            placeholder="forge$ "
                          />
                        </div>
                      </>
                    )}
                    {panelTab === "problems" && (
                      <div>No diagnostics loaded. Connect a language server or open a workspace file.</div>
                    )}
                    {panelTab === "output" && (
                      <div>
                        [Forge Gateway] API adapter aktif<br/>
                        {activeJob ? `[${activeJob.type}] ${activeJob.status} • ${activeJob.progress}%` : "Tidak ada job aktif"}<br/>
                        {activeJob?.logs?.slice(-3).map((line, i) => <div key={i}>{line}</div>)}
                      </div>
                    )}
                    {panelTab === "inference" && (
                      <div>{activeJob?.type === "inference" ? `Inference job: ${activeJob.status} • ${activeJob.progress}%` : "No inference job active"}</div>
                    )}
                    {panelTab === "trainer" && (
                      <div>{activeJob?.type === "training" ? `Training job: ${activeJob.status} • ${activeJob.progress}%` : "No training job active"}</div>
                    )}
                  </div>
                )}
              </div>
            </div>

            {/* AI PANEL */}
            {aiPanelOpen && (
              <>
                {aiPanelOpen && window.innerWidth < 1100 && (
                  <div className="ai-backdrop" onClick={() => { setAiPanelOpen(false); notify("Panel AI ditutup"); }} />
                )}
                <div className="ai-panel open">
                  <div className="ai-header">
                    <button className="back-btn" onClick={() => {
                      setAiPanelOpen(false);
                      notify("Kembali dari panel AI");
                    }}>
                      <G name="chevronLeft" size={14} />
                      <span className="desktop-only">Kembali</span>
                    </button>
                    <CopilotLogo size={20} />
                    <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }} className="desktop-only">
                      Forge AI
                    </span>
                    <span className="badge" style={{ marginLeft: "auto" }}>Gateway</span>
                  </div>

                  <div className="model-select">
                    <div style={{ fontSize: 11, letterSpacing: "0.05em", textTransform: "uppercase", color: "#71717B", fontWeight: 500, marginBottom: 8 }}>
                      Model • Quant • Compile
                    </div>
                    <button className="model-trigger" onClick={() => {
                      setModelDropdown(d => !d);
                      notify(modelDropdown ? "Dropdown model ditutup" : "Pilih model AI");
                    }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#22C55E" }} />
                        {activeModel}
                      </span>
                      <svg width="12" height="12" viewBox="0 0 12 12" style={{ transform: modelDropdown ? "rotate(180deg)" : "none", transition: "0.2s" }}>
                        <path d="M2 4L6 8L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                      </svg>
                    </button>
                    {modelDropdown && (
                      <div className="model-dropdown">
                        {MODEL_LIST.map(m => (
                          <button key={m} className="model-option" onClick={() => {
                            setActiveModel(m);
                            setModelDropdown(false);
                            notify(`Model aktif: ${m}`, "success");
                          }}>
                            <span>{m}</span>
                            {activeModel === m && <G name="check" size={12} color="#FF6A00" />}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  {renderModelBrowser()}
                  {selectedModelFile && <div className="model-preview"><h4>Isi: {selectedModelFile.name}</h4><pre>{selectedModelFile.content}</pre></div>}
                  <div className="model-empty" style={{ margin: "0 12px 12px", padding: "12px", border: "1px dashed var(--border)", borderRadius: 8, color: "var(--muted-2)", fontSize: 10 }}>
                    Belum ada model terdaftar. Gunakan AI Engineering → Models untuk bekerja dengan model yang terdeteksi gateway.
                  </div>
                  <div className="chat-area">
                    {messages.map(msg => (
                      <div key={msg.id} className={`msg ${msg.role}`}>
                        {msg.role === "ai" && (
                          <div className="msg-avatar"><CopilotLogo size={14} /></div>
                        )}
                        <div className="msg-bubble">{msg.text}</div>
                      </div>
                    ))}
                    {typing && (
                      <div className="msg ai">
                        <div className="msg-avatar"><CopilotLogo size={14} /></div>
                        <div className="msg-bubble" style={{ color: "#71717B" }}>Copilot mengetik…</div>
                      </div>
                    )}
                  </div>

                  <div className="chat-input-area">
                    <div className="quick-cmds">
                      {["/explain", "/fix", "/inspect"].map(c => (
                        <button key={c} className="quick-cmd" onClick={() => {
                          setChatInput(c + " ");
                          notify(`Command ${c} siap`);
                        }}>{c}</button>
                      ))}
                    </div>
                    <div style={{ position: "relative" }}>
                      <textarea
                        className="chat-textarea"
                        rows={2}
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } }}
                        placeholder="Tanya Forge AI… (Shift+Enter baris baru)"
                      />
                      <button className="chat-send" onClick={sendChat}><G name="arrowUp" size={14} /></button>
                    </div>
                    <div className="chat-meta">
                      <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <span style={{ width: 5, height: 5, borderRadius: "50%", background: systemStatus?.unavailable ? "#FACC15" : "#22C55E" }} />
                        {systemStatus?.unavailable ? "Gateway offline" : activeJob ? `${activeJob.type} ${activeJob.status}` : "Gateway ready"}
                      </span>
                      <span>•</span>
                      <span>On-device inference</span>
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>

          {/* STATUS BAR */}
          <div className="statusbar">
            <button className="status-item" onClick={() => notify("Branch: main • klik untuk ganti branch")}>
              <G name="gitBranch" size={12} /> No repository
            </button>
            <span className="status-item" style={{ cursor: "default" }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: systemStatus?.unavailable ? "#FACC15" : "#22C55E" }} /> {systemStatus?.unavailable ? "Gateway offline" : "Workspace ready"}
            </span>
            <button className="status-item" onClick={() => { setPanelTab("problems"); setPanelCollapsed(false); notify("Diagnostics panel dibuka"); }}>
              <G name="alert" size={12} color="#FACC15" /> Diagnostics
              <G name="x" size={11} color="#EF4444" /> 1
            </button>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
              <button className="status-item" onClick={() => notify("Device: Pixel 8 • forge")}>
                <G name="phone" size={12} /> Pixel 8
              </button>
              <button className="status-item" onClick={() => { setPanelTab("output"); setPanelCollapsed(false); }}>
                <G name="sparkles" size={12} /> {activeJob ? `${activeJob.type}: ${activeJob.status}` : "No active job"}
              </button>
              <span className="status-item desktop-only" style={{ cursor: "default" }}>UTF-8 • Kotlin</span>
            </div>
          </div>

          {pluginsOpen && <div className="dlg-overlay" onClick={() => setPluginsOpen(false)}>
            <div className="dlg plugin-dialog" onClick={e => e.stopPropagation()}>
              <h3>Editor Plugins</h3>
              <p>Kelola pack bahasa untuk syntax highlighting. File pack dibundel di proyek; aturan bahasa tidak diunduh dari CDN.</p>
              <div className="plugin-list">{LANGUAGE_PLUGINS.map(pack => {
                const enabled = editorPlugins.includes(pack.id);
                return <button key={pack.id} className="plugin-row" onClick={() => setEditorPlugins(current => current.includes(pack.id) ? current.filter(id => id !== pack.id) : [...current, pack.id])}>
                  <span className={`plugin-status ${enabled ? "enabled" : ""}`}><G name={enabled ? "check" : "plus"} size={12} /></span>
                  <span className="plugin-description"><strong>{pack.name}</strong><small>{pack.exts.map(ext => `.${ext}`).join("  ")}</small></span>
                  <span className={`plugin-state ${enabled ? "enabled" : ""}`}>{enabled ? "Aktif" : "Nonaktif"}</span>
                </button>;
              })}</div>
              <div className="plugin-notice"><G name="info" size={14} /> Plugin DLL/native tidak dijalankan langsung di browser. Penambahan plugin eksternal membutuhkan host/plugin API tepercaya.</div>
              <div className="dlg-actions"><button className="primary" onClick={() => setPluginsOpen(false)}>Selesai</button></div>
            </div>
          </div>}
          {/* COMMAND PALETTE */}
          {paletteOpen && (
            <div className="palette-overlay" onClick={() => setPaletteOpen(false)}>
              <div className="palette" onClick={e => e.stopPropagation()}>
                <div className="palette-input-row">
                  <svg width="16" height="16" viewBox="0 0 16 16" style={{ color: "#71717B" }}>
                    <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.4"/>
                    <path d="M11 11L14 14" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  </svg>
                  <input
                    className="palette-input"
                    autoFocus
                    value={paletteQuery}
                    onChange={e => setPaletteQuery(e.target.value)}
                    placeholder="Cari command… (GGUF, llama, tokenizer, compile, train)"
                  />
                  <span className="kbd">ESC</span>
                </div>
                <div className="palette-list">
                  {commands.map(c => (
                    <button key={c.id} className="palette-item" onClick={() => {
                      c.action();
                      setPaletteOpen(false);
                      setPaletteQuery("");
                    }}>
                      <div className="palette-item-icon"><G name="sparkles" size={14} /></div>
                      <span style={{ fontSize: 13 }}>{c.label}</span>
                    </button>
                  ))}
                  {commands.length === 0 && (
                    <div style={{ padding: "24px 16px", textAlign: "center", fontSize: 12, color: "#71717B" }}>
                      Tidak ada command yang cocok
                    </div>
                  )}
                </div>
                <div className="palette-footer">
                  <span><span className="kbd">↑↓</span> Navigate</span>
                  <span><G name="corner" size={11} /> Select</span>
                  <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 4 }}>
                    <G name="sparkles" size={12} /> Forge palette
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* CONTEXT MENU */}
          {ctxMenu && (() => {
            const node = ctxMenu.node;
            const isFolder = node.type === "folder";
            const items = isFolder
              ? [["File baru di sini", () => askNewFile(node.path)], ["Folder baru di sini", () => askNewFolder(node.path)], ["Rename / pindah", () => askRename(node)], ["Salin path", () => copyPath(node.path)], ["Unduh sebagai ZIP", () => exportZip(node.path)], ["Hapus", () => askDelete(node), true]]
              : [["Buka", () => openWsFile(node.path)], ["Rename / pindah", () => askRename(node)], ["Salin path", () => copyPath(node.path)], ["Unduh file", () => { const rec = wsRef.current.files[node.path]; if (rec) saveBlob(node.name, new Blob([rec.kind === "text" ? ((openTabs.find(t => t.id === node.id) || {}).content ?? rec.content) : rec.data])); }], ["Hapus", () => askDelete(node), true]];
            return (
              <>
                <div className="ctx-backdrop" onClick={() => setCtxMenu(null)} onContextMenu={(e) => { e.preventDefault(); setCtxMenu(null); }} />
                <div className="ctx-menu" style={{ left: ctxMenu.x, top: ctxMenu.y }}>
                  <div className="ctx-label">{node.path}</div>
                  {items.map(([label, run, danger]) => (
                    <button key={label} className="ctx-item" style={danger ? { color: "#FCA5A5" } : undefined} onClick={() => { setCtxMenu(null); run(); }}>{label}</button>
                  ))}
                </div>
              </>
            );
          })()}

          {/* FILE MENU */}
          {fileMenu && (() => {
            const close = (fn) => () => { setFileMenu(false); fn(); };
            const rows = [
              ["Open File…", "Ctrl+O", () => fileInputRef.current?.click()],
              ["Open Folder…", "", () => folderInputRef.current?.click()],
              ["Import ZIP ke Workspace…", "", () => zipImportRef.current?.click()],
              ["Import Code (tempel)…", "", askImportCode],
              ["New File…", "", () => askNewFile()],
              ["New Folder…", "", () => askNewFolder()],
              null,
              ["Save", "Ctrl+S", saveActive],
              ["Save All", "Ctrl+Shift+S", saveAll],
              ["Unduh file aktif (Save As)", "", () => downloadTab(activeTab)],
              ["Export Workspace → ZIP", "", () => exportZip()],
              null,
              ["Bongkar ZIP (lihat & edit isi)…", "", () => { setWorkbench("zip"); zipInputRef.current?.click(); }],
              ["Kosongkan Workspace…", "", askClearWorkspace, true],
            ];
            return (
              <>
                <div className="fm-backdrop" onClick={() => setFileMenu(false)} />
                <div className="file-menu">
                  {rows.map((r, i) => r === null ? <div key={i} className="fm-sep" /> : (
                    <button key={r[0]} className={`fm-item ${r[3] ? "danger" : ""}`} onClick={close(r[2])}><span>{r[0]}</span><small>{r[1]}</small></button>
                  ))}
                </div>
              </>
            );
          })()}

          {/* DIALOG */}
          {dialog && (
            <div className="dlg-overlay" onClick={() => setDialog(null)}>
              <form className="dlg" onClick={e => e.stopPropagation()} onSubmit={async (e) => {
                e.preventDefault();
                const ok = await dialog.onSubmit(dialog.values || {});
                if (ok !== false) setDialog(null);
              }}>
                <h3>{dialog.title}</h3>
                {dialog.message && <p>{dialog.message}</p>}
                {(dialog.fields || []).map((f, i) => (
                  <div key={f.key}>
                    <label htmlFor={`dlg-${f.key}`}>{f.label}</label>
                    {f.type === "textarea"
                      ? <textarea id={`dlg-${f.key}`} spellCheck="false" placeholder={f.placeholder} value={dialog.values[f.key] || ""} onChange={e => { const v = e.target.value; setDialog(d => ({ ...d, values: { ...d.values, [f.key]: v } })); }} />
                      : <input id={`dlg-${f.key}`} type="text" autoFocus={i === 0} autoComplete="off" autoCapitalize="off" spellCheck="false" placeholder={f.placeholder} value={dialog.values[f.key] || ""} onChange={e => { const v = e.target.value; setDialog(d => ({ ...d, values: { ...d.values, [f.key]: v } })); }} />}
                  </div>
                ))}
                <div className="dlg-actions">
                  {(dialog.extras || []).map(x => (
                    <button key={x.label} type="button" className={x.danger ? "danger" : ""} onClick={() => { x.onClick(); if (!x.keepOpen) setDialog(null); }}>{x.label}</button>
                  ))}
                  <button type="button" onClick={() => setDialog(null)}>Batal</button>
                  <button type="submit" className={dialog.danger ? "danger" : "primary"}>{dialog.submitLabel || "OK"}</button>
                </div>
              </form>
            </div>
          )}

          {busy && <div className="busy-banner">{busy}</div>}

          {/* input file tersembunyi untuk Open File / Open Folder / Import ZIP / Bongkar ZIP */}
          <input ref={fileInputRef} type="file" multiple onChange={handleOpenFiles} style={{ display: "none" }} />
          <input ref={folderInputRef} type="file" multiple webkitdirectory="" directory="" onChange={handleOpenFolder} style={{ display: "none" }} />
          <input ref={zipImportRef} type="file" accept=".zip,application/zip,application/x-zip-compressed" onChange={handleImportZip} style={{ display: "none" }} />
          <input ref={zipInputRef} type="file" accept=".zip,application/zip,application/x-zip-compressed" onChange={handleZipUpload} style={{ display: "none" }} />

          {/* TOASTS */}
          <div className="toasts">
            {toasts.map(t => (
              <div key={t.id} className={`toast ${t.type}`}>
                <div className="toast-icon">
                  {t.type === "success" ? <G name="check" size={13} /> : t.type === "error" ? <G name="x" size={13} /> : <G name="info" size={13} />}
                </div>
                <span>{t.msg}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
