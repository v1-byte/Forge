      ),
    };

    // ===== DATA =====
    // Runtime-backed data. Files and models come from the workspace gateway.
    const FILE_TREE = [];
    const MODELS = [];
    const MODEL_LIST = [];
    const MODEL_FILES = {};

    const ACTIVITY = [
      { id: "explorer", label: "Explorer", icon: Icon.Explorer, toast: "Explorer dibuka — navigasi file project" },
      { id: "search", label: "Search", icon: Icon.Search, toast: "Search aktif — cari di seluruh workspace" },
      { id: "git", label: "Source Control", icon: Icon.Git, toast: "Source Control — branch & commit" },
      { id: "debug", label: "Run & Debug", icon: Icon.Debug, toast: "Run & Debug siap — mulai debug session" },
      { id: "ai-engineering", label: "AI Engineering", icon: Icon.AI, toast: "AI Engineering — code, model, token, engine, machine, training" },
    ];

    // ===== WORKSPACE LOKAL (jalan tanpa gateway; tersimpan di browser/WebView) =====
    // Bentuk data: { files: { "path/file.js": {kind:"text", content} | {kind:"bin", data:Uint8Array} }, dirs: ["folder/kosong"] }
    const MAX_TEXT_BYTES = 2.5 * 1024 * 1024;
    const MAX_ZIP_UNPACKED = 400 * 1024 * 1024;
    const SKIP_DIRS = /(^|\/)(node_modules|\.git)(\/|$)/;
    const normPath = (p = "") => String(p).replace(/\\/g, "/").split("/").filter(s => s && s !== "." && s !== "..").join("/");
    const baseName = (p = "") => p.split("/").pop();
    const extOf = (n = "") => { const b = baseName(n); return b.includes(".") ? b.split(".").pop().toLowerCase() : "txt"; };
    const parentOf = (p = "") => p.split("/").slice(0, -1).join("/");
    const looksBinary = (u8) => { const n = Math.min(u8.length, 8000); for (let i = 0; i < n; i++) if (u8[i] === 0) return true; return false; };
    const fmtSize = (n = 0) => n < 1024 ? `${n} B` : n < 1048576 ? `${(n / 1024).toFixed(1)} KB` : `${(n / 1048576).toFixed(1)} MB`;
    const toRec = (u8) => (u8.length <= MAX_TEXT_BYTES && !looksBinary(u8)) ? { kind: "text", content: new TextDecoder("utf-8").decode(u8) } : { kind: "bin", data: u8 };
    const readAsU8 = async (file) => new Uint8Array(await file.arrayBuffer());

    let _dbPromise = null;
    const openDb = () => _dbPromise || (_dbPromise = new Promise((resolve, reject) => {
      try {
        const req = indexedDB.open("forge-workbench", 1);
        req.onupgradeneeded = () => req.result.createObjectStore("kv");
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      } catch (e) { reject(e); }
    }));
    const idbGet = async (key) => { const db = await openDb(); return new Promise((resolve, reject) => { const q = db.transaction("kv").objectStore("kv").get(key); q.onsuccess = () => resolve(q.result); q.onerror = () => reject(q.error); }); };
    const idbSet = async (key, value) => { const db = await openDb(); return new Promise((resolve, reject) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(value, key); t.oncomplete = () => resolve(); t.onerror = () => reject(t.error); t.onabort = () => reject(t.error); }); };

    // Unduh/simpan ke perangkat. Memakai <a download>, bekerja di browser; di WebView Android butuh DownloadListener.
    const saveBlob = (name, blob) => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = name; a.style.display = "none";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 10000);
    };

    const buildTree = (ws) => {
      const root = { children: [], map: {} };
      const ensureDir = (p) => {
        let cur = root, acc = "";
        for (const seg of p.split("/")) {
          acc = acc ? `${acc}/${seg}` : seg;
          let n = cur.map[seg];
          if (!n) { n = { id: `ws:${acc}`, path: acc, name: seg, type: "folder", children: [], map: {} }; cur.map[seg] = n; cur.children.push(n); }
          cur = n;
        }
        return cur;
      };
      (ws.dirs || []).forEach(d => d && ensureDir(d));
      Object.keys(ws.files).forEach(p => {
        const dir = parentOf(p);
        const parent = dir ? ensureDir(dir) : root;
        parent.children.push({ id: `ws:${p}`, path: p, name: baseName(p), type: "file", ext: extOf(p) });
      });
      const sortRec = (nodes) => { nodes.sort((a, b) => (a.type === b.type ? a.name.localeCompare(b.name) : a.type === "folder" ? -1 : 1)); nodes.forEach(n => n.children && sortRec(n.children)); };
      sortRec(root.children);
      return root.children;
    };

    // ===== TOAST =====
    function useToast() {
      const [toasts, setToasts] = useState([]);
      const push = useCallback((msg, type = "info") => {
        const id = Math.random().toString(36).slice(2);
        setToasts(t => [...t, { id, msg, type }]);
        setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 2800);
      }, []);
      return { toasts, push };
    }

    // ===== MAIN APP =====
    function App() {
      const { toasts, push } = useToast();

      const [activity, setActivity] = useState("explorer");
      const [toolMode, setToolMode] = useState("models");
      const [workbenchMode, setWorkbenchMode] = useState("code");
      const [zipName, setZipName] = useState("");
      const [zipEntries, setZipEntries] = useState([]);
      const [aiGroup, setAiGroup] = useState("files");
      const [aiEngineeringTab, setAiEngineeringTab] = useState("code");
      const [zipGroup, setZipGroup] = useState("all");
      const zipInputRef = useRef(null);
      const [sidebarOpen, setSidebarOpen] = useState(window.innerWidth >= 768);
      const [sidebarCollapsed, setSidebarCollapsed] = useState(false);
      const [expanded, setExpanded] = useState({ root: true, "2": true, "4": true, "6": true });
      const [panelTab, setPanelTab] = useState("terminal");
      const [panelCollapsed, setPanelCollapsed] = useState(false);
      const [activeModel, setActiveModel] = useState("No model selected");
      const [modelDropdown, setModelDropdown] = useState(false);
      const [openedModel, setOpenedModel] = useState("");
      const [selectedModelFile, setSelectedModelFile] = useState(null);
      const [aiPanelOpen, setAiPanelOpen] = useState(false);
      const [paletteOpen, setPaletteOpen] = useState(false);
      const [paletteQuery, setPaletteQuery] = useState("");
      const [ctxMenu, setCtxMenu] = useState(null);

      const [openTabs, setOpenTabs] = useState([]);
      const [activeTabId, setActiveTabId] = useState("2-1");
      const activeTab = useMemo(() => openTabs.find(t => t.id === activeTabId), [openTabs, activeTabId]);

      const [chatInput, setChatInput] = useState("");
      const [messages, setMessages] = useState([]);
      const [typing, setTyping] = useState(false);
      const [termLines, setTermLines] = useState(["Forge terminal connected — workspace kosong"]);
      const [termInput, setTermInput] = useState("");
      const [quantizeProgress, setQuantizeProgress] = useState({});
      const termRef = useRef(null);
      const [systemStatus, setSystemStatus] = useState(null);
      const [activeJob, setActiveJob] = useState(null);

      // Workspace lokal (file nyata yang bisa dibuka, diedit, disimpan, diimpor, diekspor)
      const [ws, setWs] = useState({ files: {}, dirs: [] });
      const [wsReady, setWsReady] = useState(false);
      const wsRef = useRef(ws); wsRef.current = ws;
      const [fileMenu, setFileMenu] = useState(false);
      const [dialog, setDialog] = useState(null);
      const [busy, setBusy] = useState("");
      const archiveRef = useRef(null);
      const fileInputRef = useRef(null);
      const folderInputRef = useRef(null);
      const zipImportRef = useRef(null);
      const actionsRef = useRef({});
      const treeNodes = useMemo(() => buildTree(ws), [ws]);
      const fileCount = Object.keys(ws.files).length;

      // Muat workspace yang tersimpan
      useEffect(() => {
        idbGet("workspace").then(saved => { if (saved && saved.files) setWs({ files: saved.files, dirs: saved.dirs || [] }); }).catch(() => {}).finally(() => setWsReady(true));
      }, []);
      // Simpan workspace otomatis (debounce) setiap ada perubahan
      useEffect(() => {
        if (!wsReady) return;
        const t = setTimeout(() => { idbSet("workspace", ws).catch(() => {}); }, 400);
        return () => clearTimeout(t);
      }, [ws, wsReady]);

      // Keyboard shortcuts
      useEffect(() => {
        const onKey = (e) => {
          const mod = e.ctrlKey || e.metaKey;
          if (mod && e.key.toLowerCase() === "k") {
            e.preventDefault();
            setPaletteOpen(v => !v);
          }
          if (mod && e.key.toLowerCase() === "s") {
            e.preventDefault();
            if (e.shiftKey) actionsRef.current.saveAll?.(); else actionsRef.current.saveActive?.();
          }
          if (mod && e.key.toLowerCase() === "o") {
            e.preventDefault();
            fileInputRef.current?.click();
          }
          if (e.key === "Escape") {
            setPaletteOpen(false);
            setModelDropdown(false);
            setCtxMenu(null);
            setFileMenu(false);
            setDialog(d => (d ? null : d));
            if (window.innerWidth < 1100) setAiPanelOpen(false);
          }
        };
        window.addEventListener("keydown", onKey);
        return () => window.removeEventListener("keydown", onKey);
      }, []);

      // Auto focus terminal
      useEffect(() => {
        if (panelTab === "terminal" && !panelCollapsed && termRef.current) {
          termRef.current.focus();
        }
      }, [panelTab, panelCollapsed]);

      const notify = (msg, type = "info") => {
        push(msg, type);
        try { navigator.vibrate?.(10); } catch {}
      };

      const apiRequest = async (url, options = {}) => {
        const response = await fetch(url, { headers: { "content-type": "application/json", ...(options.headers || {}) }, ...options });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || data.ok === false) throw new Error(data.error?.message || `API ${response.status}`);
        return data;
      };

      const runActiveFile = async () => {
        setPanelTab("output");
        if (!activeTab) { notify("Buka file dulu sebelum Run", "error"); setTermLines(l => [...l, "[Run] Tidak ada file aktif"].slice(-80)); return; }
        const ext = (activeTab.ext || activeTab.name.split(".").pop() || "").toLowerCase();
        if (!["js", "mjs", "py", "sh"].includes(ext)) { notify(`Run belum mendukung .${ext}`, "error"); setTermLines(l => [...l, `[Run] .${ext} belum didukung (js, mjs, py, sh)`].slice(-80)); return; }
        notify(`Menjalankan ${activeTab.name}...`, "info");
        setTermLines(l => [...l, `$ run ${activeTab.name}`].slice(-80));
        try {
          const response = await fetch("/api/run", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ code: activeTab.content, name: activeTab.name }) });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.error?.message || `API ${response.status}`);
          const lines = String(data.output || "").split("\n").filter((x, i, a) => x || i < a.length - 1);
          setTermLines(l => [...l, ...lines, data.timedOut ? "[Run] Dihentikan: melewati batas waktu" : `[Run] selesai • exit ${data.exitCode} • ${data.ms} ms`].slice(-80));
          notify(data.ok ? "Run selesai" : "Run gagal", data.ok ? "success" : "error");
        } catch (error) {
          setTermLines(l => [...l, `[Run] ${error.message}`].slice(-80));
          notify(error.message, "error");
        }
      };

      useEffect(() => {
        apiRequest("/api/status").then(data => setSystemStatus(data)).catch(() => setSystemStatus({ unavailable: true }));
      }, []);

      const submitJob = async (type, payload = {}) => {
        try {
          const data = await apiRequest("/api/jobs", { method: "POST", body: JSON.stringify({ type, payload }) });
          setActiveJob(data.job);
          notify(`${type} job dibuat: ${data.job.id.slice(0, 8)}`, "success");
          const poll = async () => {
            try {
              const current = await apiRequest(`/api/jobs/${data.job.id}`);
              setActiveJob(current.job);
              if (["queued", "running"].includes(current.job.status)) setTimeout(poll, 350);
              else notify(`${type}: ${current.job.status}`, current.job.status === "completed" ? "success" : "error");
            } catch (error) { notify(`Job error: ${error.message}`, "error"); }
          };
          setTimeout(poll, 350);
          return data.job;
        } catch (error) { notify(`Gateway belum siap: ${error.message}`, "error"); return null; }
      };

      const classifyPath = (name = "") => {
        const value = name.toLowerCase();
        const ext = value.split(".").pop();
        const engine = value.match(/forge-(compiler|editor|inference|trainer|litgpt)/)?.[0] ||
          (value.includes("unsloth") ? "forge-trainer" : value.includes("litgpt") ? "forge-litgpt" : value.includes("llama") || value.includes("gguf") ? "forge-inference" : "");
        const isToken = /tokenizer|vocab|sentencepiece|token/.test(value);
        const isBinary = /\.(gguf|safetensors|bin|pt|pth|ckpt|onnx|so|dll|dylib|a|wasm|apk|zip)$/i.test(value);
        const isCode = /\.(c|cc|cpp|h|hpp|py|js|ts|tsx|jsx|java|kt|rs|go|swift|smali|sh)$/i.test(value);
        const isSystem = /(^|[/_.-])(config|manifest|settings|schema|package|cmake|docker|lock|env)([/_.-]|$)|\.(json|yaml|yml|toml|xml)$/i.test(value);
        let group = "files";
        if (engine && value.includes("forge-engine")) group = "engines";
        else if (isBinary || isToken) group = "machines";
        else if (isSystem) group = "system";
        else if (isCode) group = "files";
        return { group, engine, kind: isToken ? "token" : isBinary ? "binary" : isCode ? "code" : isSystem ? "system" : "file" };
      };

      const CATEGORY_LABELS = { all: "Semua", system: "System", files: "File", engines: "Engine", machines: "Mesin" };
      const CATEGORY_KIND_LABELS = { code: "kode", binary: "biner", token: "token", system: "config", file: "file" };

      // ====================== FILE MANAGER NYATA ======================
      const isMobile = () => window.innerWidth < 768;
      const showExplorer = () => { setActivity("explorer"); setSidebarOpen(true); };
      const needZip = () => { if (window.JSZip) return true; notify("Library ZIP belum termuat — buka aplikasi sekali dengan internet", "error"); return false; };

      const openWsFile = (path, rec = wsRef.current.files[path]) => {
        if (!rec) { notify(`File tidak ditemukan: ${path}`, "error"); return; }
        const id = `ws:${path}`, name = baseName(path), ext = extOf(path);
        const tab = rec.kind === "text"
          ? { id, source: "ws", path, name, ext, content: rec.content, saved: rec.content, modified: false }
          : { id, source: "ws", path, name, ext, binary: true, readOnly: true, saved: "", modified: false, content: `File biner — tidak bisa diedit sebagai teks.\npath: ${path}\nukuran: ${fmtSize(rec.data.length)}\n\nGunakan tombol Unduh untuk menyimpan file ini ke perangkat.` };
        setOpenTabs(tabs => tabs.find(t => t.id === id) ? tabs : [...tabs, tab]);
        setActiveTabId(id);
        if (isMobile()) setSidebarOpen(false);
      };

      const openFile = (file) => {
        if (file.type === "folder") { setExpanded(e => ({ ...e, [file.id]: !e[file.id] })); return; }
        openWsFile(file.path);
      };

      const commitFiles = (list, { dirs = [], expandAll = true } = {}) => {
        if (!list.length && !dirs.length) return;
        setWs(w => {
          const files = { ...w.files };
          list.forEach(([p, rec]) => { files[p] = rec; });
          return { files, dirs: [...new Set([...(w.dirs || []), ...dirs])] };
        });
        // file yang sedang terbuka dan ditimpa ikut diperbarui
        setOpenTabs(tabs => tabs.map(t => {
          const hit = t.source === "ws" && list.find(([p]) => p === t.path);
          return hit && hit[1].kind === "text" && !t.binary ? { ...t, content: hit[1].content, saved: hit[1].content, modified: false } : t;
        }));
        setExpanded(e => {
          const n = { ...e };
          [...list.map(([p]) => parentOf(p)), ...dirs].forEach(dir => {
            let acc = "";
            const segs = dir.split("/").filter(Boolean);
            (expandAll ? segs : segs.slice(0, 1)).forEach(s => { acc = acc ? `${acc}/${s}` : s; n[`ws:${acc}`] = true; });
          });
          return n;
        });
      };

      const markSaved = (id, content) => setOpenTabs(tabs => tabs.map(t => t.id === id ? { ...t, saved: content, modified: t.content !== content } : t));

      const saveTab = async (tab, silent = false) => {
        if (!tab) return false;
        if (tab.readOnly) { if (!silent) notify("File ini hanya-baca (biner/model). Gunakan Unduh.", "info"); return false; }
        const content = tab.content;
        if (tab.source === "zip") {
          if (!archiveRef.current) { notify("ZIP sumber sudah ditutup — tidak bisa menyimpan", "error"); return false; }
          archiveRef.current.file(tab.zipEntry, content);
          markSaved(tab.id, content);
          if (!silent) notify(`Disimpan ke dalam ZIP: ${tab.zipEntry} — tekan "Unduh ZIP" untuk mengekspor`, "success");
          return true;
        }
        const path = tab.path || tab.name;
        setWs(w => ({ ...w, files: { ...w.files, [path]: { kind: "text", content } } }));
        markSaved(tab.id, content);
        let server = false;
        if (systemStatus && !systemStatus.unavailable && content.length < 1500000) {
          try { await apiRequest("/api/files/write", { method: "POST", body: JSON.stringify({ path, content, allowNonCode: true }) }); server = true; } catch {}
        }
        if (!silent) notify(`Disimpan: ${path}${server ? " (+ server gateway)" : ""}`, "success");
        return true;
      };
      const saveActive = () => { if (!activeTab) { notify("Tidak ada file terbuka untuk disimpan", "error"); return Promise.resolve(false); } return saveTab(activeTab); };
      const saveAll = async () => {
        const dirty = openTabs.filter(t => t.modified && !t.readOnly);
        if (!dirty.length) { notify("Tidak ada perubahan yang perlu disimpan", "info"); return; }
        for (const t of dirty) await saveTab(t, true);
        notify(`${dirty.length} file disimpan`, "success");
      };

      const downloadTab = async (tab = activeTab) => {
        if (!tab) { notify("Tidak ada file terbuka", "error"); return; }
        try {
          let blob;
          if (tab.binary) blob = tab.source === "zip" ? await archiveRef.current.file(tab.zipEntry).async("blob") : new Blob([wsRef.current.files[tab.path].data]);
          else blob = new Blob([tab.content], { type: "text/plain;charset=utf-8" });
          saveBlob(tab.name, blob);
          notify(`Diunduh: ${tab.name}`, "success");
        } catch { notify("Gagal mengunduh file", "error"); }
      };

      const exportZip = async (folder = "") => {
        if (!needZip()) return;
        const w = wsRef.current;
        const keys = Object.keys(w.files).filter(p => !folder || p.startsWith(`${folder}/`));
        if (!keys.length) { notify("Workspace kosong — tidak ada yang diekspor", "error"); return; }
        setBusy("Membuat ZIP…");
        try {
          const live = {};
          openTabs.forEach(t => { if (t.source === "ws" && !t.binary) live[t.path] = t.content; });
          const zip = new window.JSZip();
          keys.forEach(p => { const rec = w.files[p]; zip.file(folder ? p.slice(folder.length + 1) : p, rec.kind === "text" ? (live[p] !== undefined ? live[p] : rec.content) : rec.data); });
          (w.dirs || []).forEach(d => { if (!folder) zip.folder(d); else if (d.startsWith(`${folder}/`)) zip.folder(d.slice(folder.length + 1)); });
          const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
          saveBlob(folder ? `${baseName(folder)}.zip` : "forge-workspace.zip", blob);
          notify(`ZIP dibuat: ${keys.length} file (${fmtSize(blob.size)})`, "success");
        } catch { notify("Gagal membuat ZIP", "error"); } finally { setBusy(""); }
      };

      const downloadArchive = async () => {
        if (!archiveRef.current || !needZip()) return;
        setBusy("Membuat ZIP…");
        try {
          openTabs.forEach(t => { if (t.source === "zip" && !t.readOnly) archiveRef.current.file(t.zipEntry, t.content); });
          const blob = await archiveRef.current.generateAsync({ type: "blob", compression: "DEFLATE" });
          saveBlob(`${zipName.replace(/\.zip$/i, "") || "archive"}-edited.zip`, blob);
          notify(`ZIP hasil edit diunduh (${fmtSize(blob.size)})`, "success");
        } catch { notify("Gagal membuat ZIP", "error"); } finally { setBusy(""); }
      };

      const handleOpenFiles = async (event) => {
        const files = [...(event.target.files || [])]; event.target.value = "";
        if (!files.length) return;
        setBusy(`Membuka ${files.length} file…`);
        try {
          const list = [];
          for (const f of files) { const p = normPath(f.name); if (p) list.push([p, toRec(await readAsU8(f))]); }
          commitFiles(list);
          showExplorer();
          const first = list.find(([, r]) => r.kind === "text") || list[0];
          if (first) openWsFile(first[0], first[1]);
          notify(`${list.length} file dibuka${list.length > 1 ? " (ditambahkan ke Explorer)" : ""}`, "success");
        } catch { notify("Gagal membaca file", "error"); } finally { setBusy(""); }
      };

      const handleOpenFolder = async (event) => {
        const files = [...(event.target.files || [])]; event.target.value = "";
        if (!files.length) return;
        setBusy(`Membaca folder (${files.length} file)…`);
        try {
          const list = []; let skipped = 0;
          for (const f of files) {
            const rel = normPath(f.webkitRelativePath || f.name);
            if (!rel) continue;
            if (SKIP_DIRS.test(rel)) { skipped++; continue; }
            if (list.length >= 5000) { skipped++; continue; }
            list.push([rel, toRec(await readAsU8(f))]);
          }
          commitFiles(list, { expandAll: false });
          showExplorer();
          notify(`${list.length} file dimuat dari folder${skipped ? ` (${skipped} dilewati: node_modules/.git/batas 5000)` : ""}`, "success");
        } catch { notify("Gagal membaca folder", "error"); } finally { setBusy(""); }
      };

      const importZipObject = async (zip, label) => {
        const all = Object.keys(zip.files);
        const fileNames = all.filter(n => !zip.files[n].dir);
        const total = fileNames.reduce((s, n) => s + (zip.files[n]._data?.uncompressedSize || 0), 0);
        if (total > MAX_ZIP_UNPACKED) { notify(`ZIP terlalu besar (${fmtSize(total)} saat diekstrak; batas ${fmtSize(MAX_ZIP_UNPACKED)})`, "error"); return; }
        const tops = new Set(all.map(n => normPath(n).split("/")[0]).filter(Boolean));
        const singleRoot = tops.size === 1 && fileNames.every(n => normPath(n).includes("/"));
        const wrap = normPath(label.replace(/\.zip$/i, "")) || "zip";
        const prefix = singleRoot ? "" : `${wrap}/`;
        const list = []; let skipped = 0;
        for (const n of fileNames) {
          const rel = normPath(n);
          if (!rel) continue;
          if (SKIP_DIRS.test(rel)) { skipped++; continue; }
          list.push([prefix + rel, toRec(await zip.files[n].async("uint8array"))]);
        }
        const dirs = all.filter(n => zip.files[n].dir).map(n => normPath(n)).filter(Boolean).filter(d => !SKIP_DIRS.test(d)).map(d => prefix + d);
        if (!list.length && !dirs.length) { notify("ZIP kosong — tidak ada file untuk diimpor", "error"); return; }
        commitFiles(list, { dirs, expandAll: false });
        showExplorer();
        notify(`${list.length} file diekstrak dari ${label} ke Explorer${skipped ? ` (${skipped} dilewati: node_modules/.git)` : ""}`, "success");
      };

      const handleImportZip = async (event) => {
        const file = event.target.files?.[0]; event.target.value = "";
        if (!file || !needZip()) return;
        setBusy(`Mengekstrak ${file.name}…`);
        try { await importZipObject(await window.JSZip.loadAsync(file), file.name); }
        catch { notify("ZIP tidak bisa dibaca atau rusak", "error"); } finally { setBusy(""); }
      };

      const extractArchive = async () => {
        if (!archiveRef.current) return;
        setBusy(`Mengekstrak ${zipName}…`);
        try { await importZipObject(archiveRef.current, zipName || "archive.zip"); } catch { notify("Gagal mengekstrak ZIP", "error"); } finally { setBusy(""); }
      };

      const uniquePath = (p) => {
        if (!wsRef.current.files[p]) return p;
        const dot = baseName(p).lastIndexOf(".");
        const dir = parentOf(p), name = baseName(p);
        const stem = dot > 0 ? name.slice(0, dot) : name, ext = dot > 0 ? name.slice(dot) : "";
        for (let i = 2; i < 1000; i++) { const c = `${dir ? dir + "/" : ""}${stem}-${i}${ext}`; if (!wsRef.current.files[c]) return c; }
        return p;
      };

      const openDialog = (cfg) => setDialog({ values: {}, ...cfg });
      const askNewFile = (dir = "") => openDialog({
        title: "File baru", message: dir ? `Dibuat di folder: ${dir}` : "Boleh memakai folder, mis. src/app.js",
        fields: [{ key: "path", label: "Nama file", placeholder: "contoh.js" }], values: { path: "" }, submitLabel: "Buat",
        onSubmit: (v) => {
          const p = normPath(`${dir ? dir + "/" : ""}${v.path || ""}`);
          if (!p) { notify("Nama file kosong", "error"); return false; }
          if (wsRef.current.files[p]) { notify("File sudah ada", "error"); return false; }
          const rec = { kind: "text", content: "" };
          commitFiles([[p, rec]]); showExplorer(); openWsFile(p, rec); notify(`File dibuat: ${p}`, "success");
          return true;
        },
      });
      const askNewFolder = (dir = "") => openDialog({
        title: "Folder baru", message: dir ? `Dibuat di dalam: ${dir}` : "Boleh bertingkat, mis. src/components",
        fields: [{ key: "path", label: "Nama folder", placeholder: "folder-baru" }], values: { path: "" }, submitLabel: "Buat",
        onSubmit: (v) => {
          const p = normPath(`${dir ? dir + "/" : ""}${v.path || ""}`);
          if (!p) { notify("Nama folder kosong", "error"); return false; }
          commitFiles([], { dirs: [p] }); showExplorer(); notify(`Folder dibuat: ${p}`, "success");
          return true;
        },
      });
      const askImportCode = () => openDialog({
        title: "Import Code", message: "Tempel kode, beri nama file, lalu simpan ke Explorer.",
        fields: [{ key: "name", label: "Nama file", placeholder: "kode-baru.js" }, { key: "code", label: "Kode", type: "textarea", placeholder: "// tempel kode di sini" }],
        values: { name: "kode-baru.js", code: "" }, submitLabel: "Import",
        extras: [{ label: "Tempel dari clipboard", keepOpen: true, onClick: () => { navigator.clipboard?.readText().then(t => setDialog(d => d ? { ...d, values: { ...d.values, code: t } } : d)).catch(() => notify("Clipboard diblokir — tempel manual di kotak kode", "info")); } }],
        onSubmit: (v) => {
          const name = normPath(v.name || "");
          if (!name) { notify("Nama file kosong", "error"); return false; }
          if (!String(v.code || "").trim()) { notify("Kode masih kosong", "error"); return false; }
          const p = uniquePath(name), rec = { kind: "text", content: String(v.code) };
          commitFiles([[p, rec]]); showExplorer(); openWsFile(p, rec);
          notify(p === name ? `Kode diimpor: ${p}` : `Nama sudah ada — disimpan sebagai ${p}`, "success");
          return true;
        },
      });
      const askRename = (node) => openDialog({
        title: node.type === "folder" ? "Ganti nama / pindah folder" : "Ganti nama / pindah file", message: `Sekarang: ${node.path}`,
        fields: [{ key: "path", label: "Path baru" }], values: { path: node.path }, submitLabel: "Simpan",
        onSubmit: (v) => renamePath(node.path, v.path, node.type === "folder"),
      });
      const askDelete = (node) => openDialog({
        title: `Hapus ${node.type === "folder" ? "folder" : "file"}?`, message: `"${node.path}"${node.type === "folder" ? " beserta seluruh isinya" : ""} akan dihapus dari workspace. Tindakan ini tidak bisa dibatalkan.`,
        submitLabel: "Hapus", danger: true,
        onSubmit: () => { deletePath(node.path, node.type === "folder"); return true; },
      });
      const askClearWorkspace = () => openDialog({
        title: "Kosongkan workspace?", message: `${fileCount} file di Explorer akan dihapus. Ekspor ZIP dulu bila perlu.`, submitLabel: "Kosongkan", danger: true,
        onSubmit: () => { setWs({ files: {}, dirs: [] }); setOpenTabs(tabs => tabs.filter(t => t.source !== "ws")); notify("Workspace dikosongkan", "success"); return true; },
      });

      const renamePath = (oldP, rawNew, isFolder) => {
        const neu = normPath(rawNew);
        if (!neu) { notify("Nama kosong", "error"); return false; }
        if (neu === oldP) return true;
        if (isFolder && neu.startsWith(`${oldP}/`)) { notify("Folder tidak bisa dipindah ke dalam dirinya sendiri", "error"); return false; }
        const w = wsRef.current;
        const move = (p) => p === oldP ? neu : (isFolder && p.startsWith(`${oldP}/`)) ? neu + p.slice(oldP.length) : null;
        const files = {}, moved = [];
        for (const [p, r] of Object.entries(w.files)) { const m = move(p); if (m === null) files[p] = r; else moved.push([m, r]); }
        for (const [m, r] of moved) { if (files[m]) { notify(`Sudah ada: ${m}`, "error"); return false; } files[m] = r; }
        setWs({ files, dirs: (w.dirs || []).map(d => { const m = move(d); return m === null ? d : m; }) });
        setOpenTabs(tabs => tabs.map(t => { if (t.source !== "ws") return t; const m = move(t.path); return m ? { ...t, id: `ws:${m}`, path: m, name: baseName(m), ext: extOf(m) } : t; }));
        const cur = openTabs.find(x => x.id === activeTabId);
        if (cur && cur.source === "ws") { const m = move(cur.path); if (m) setActiveTabId(`ws:${m}`); }
        setExpanded(e => { const n = {}; Object.keys(e).forEach(k => { const m = k.startsWith("ws:") ? move(k.slice(3)) : null; n[m ? `ws:${m}` : k] = e[k]; }); return n; });
        notify(`Dipindah: ${oldP} → ${neu}`, "success");
        return true;
      };

      const deletePath = (p, isFolder) => {
        const inScope = (x) => x === p || (isFolder && x.startsWith(`${p}/`));
        setWs(w => { const files = {}; Object.entries(w.files).forEach(([k, r]) => { if (!inScope(k)) files[k] = r; }); return { files, dirs: (w.dirs || []).filter(d => !inScope(d)) }; });
        setOpenTabs(tabs => tabs.filter(t => !(t.source === "ws" && inScope(t.path))));
        notify(`Dihapus: ${p}`, "success");
      };

      const formatActive = () => {
        if (!activeTab || activeTab.readOnly) { notify("Tidak ada file teks aktif untuk diformat", "error"); return; }
        let out = activeTab.content;
        try {
          if (activeTab.ext === "json") out = `${JSON.stringify(JSON.parse(out), null, 2)}\n`;
          else if (out.trim()) out = out.replace(/\r\n/g, "\n").replace(/[ \t]+$/gm, "").replace(/\n*$/, "\n");
        } catch (e) { notify(`Format gagal: ${e.message}`, "error"); return; }
        if (out === activeTab.content) { notify("Sudah rapi", "info"); return; }
        setOpenTabs(tabs => tabs.map(t => t.id === activeTab.id ? { ...t, content: out, modified: out !== t.saved } : t));
        notify("Format selesai — tekan Save untuk menyimpan", "success");
      };
      const inspectActive = () => {
        if (!activeTab) { notify("Tidak ada file terbuka", "error"); return; }
        const lines = activeTab.content.split("\n").length;
        const bytes = activeTab.binary ? (activeTab.source === "zip" ? 0 : wsRef.current.files[activeTab.path]?.data?.length || 0) : new TextEncoder().encode(activeTab.content).length;
        const msg = `${activeTab.path || activeTab.zipEntry || activeTab.name} • ${activeTab.binary ? "biner" : `${lines} baris`} • ${fmtSize(bytes)} • .${activeTab.ext}`;
        setPanelTab("terminal"); setPanelCollapsed(false);
        setTermLines(l => [...l, `[Inspect] ${msg}`].slice(-80));
        notify(msg, "info");
      };
      const copyPath = (p) => { (navigator.clipboard?.writeText(p) || Promise.reject()).then(() => notify(`Path disalin: ${p}`, "success")).catch(() => notify(p, "info")); };

      actionsRef.current = { saveActive, saveAll };

      const doCloseTab = (id) => {
        const idx = openTabs.findIndex(t => t.id === id);
        const next = openTabs.filter(t => t.id !== id);
        setOpenTabs(next);
        if (activeTabId === id) setActiveTabId(next.length ? next[Math.max(0, idx - 1)].id : "");
      };
      const closeTab = (id, e) => {
        e?.stopPropagation();
        const tab = openTabs.find(t => t.id === id);
        if (!tab) return;
        if (tab.modified) {
          openDialog({
            title: "Perubahan belum disimpan", message: `"${tab.name}" punya perubahan yang belum disimpan.`, submitLabel: "Simpan & tutup",
            extras: [{ label: "Tutup tanpa simpan", danger: true, onClick: () => doCloseTab(id) }],
            onSubmit: async () => { await saveTab(tab, true); doCloseTab(id); return true; },
          });
          return;
        }
        doCloseTab(id);
      };
      const closeAllTabs = () => {
        if (!openTabs.length) return;
        const dirty = openTabs.filter(t => t.modified);
        if (dirty.length) {
          openDialog({
            title: "Perubahan belum disimpan", message: `${dirty.length} file punya perubahan yang belum disimpan.`, submitLabel: "Simpan semua & tutup",
            extras: [{ label: "Tutup tanpa simpan", danger: true, onClick: () => setOpenTabs([]) }],
            onSubmit: async () => { for (const t of dirty) await saveTab(t, true); setOpenTabs([]); return true; },
          });
          return;
        }
        setOpenTabs([]);
      };

      // pastikan tab aktif selalu valid; peringatkan sebelum menutup halaman bila ada yang belum disimpan
      useEffect(() => { if (openTabs.length && !openTabs.some(t => t.id === activeTabId)) setActiveTabId(openTabs[openTabs.length - 1].id); }, [openTabs, activeTabId]);
      const anyDirty = openTabs.some(t => t.modified);
      useEffect(() => {
        window.onbeforeunload = anyDirty ? (e) => { e.preventDefault(); e.returnValue = ""; return ""; } : null;
        return () => { window.onbeforeunload = null; };
      }, [anyDirty]);

      const switchActivity = (item) => {
        setActivity(item.id);
        setSidebarOpen(true);
        if (item.id === "ai-engineering") {
          setWorkbenchMode("ai-engineering");
          setAiEngineeringTab("code");
          setAiPanelOpen(true);
        }
        notify(item.toast);
      };

      const runQuantize = (name) => {
        submitJob("quantize", { model: name, target: "Q4_K_M" });
        if (quantizeProgress[name] !== undefined) return;
        setQuantizeProgress(p => ({ ...p, [name]: 0 }));
        notify(`Mulai quantize ${name}...`);
        const iv = setInterval(() => {
          setQuantizeProgress(p => {
            const cur = (p[name] || 0) + Math.random() * 18;
            if (cur >= 100) {
              clearInterval(iv);
              setTimeout(() => {
                setQuantizeProgress(prev => {
                  const n = { ...prev };
                  delete n[name];
                  return n;
                });
                notify(`${name} berhasil di-quantize ke Q4_K_M`, "success");
              }, 400);
              return { ...p, [name]: 100 };
            }
            return { ...p, [name]: cur };
          });
        }, 280);
      };

      const sendChat = () => {
        if (!chatInput.trim()) return;
        const userMsg = { id: Date.now().toString(), role: "user", text: chatInput };
        setMessages(m => [...m, userMsg]);
        const q = chatInput;
        setChatInput("");
        setTyping(true);
        submitJob("inference", { prompt: q, file: activeTab?.name || null }).then(job => {
          setMessages(m => [...m, { id: (Date.now() + 1).toString(), role: "system", text: job ? `Inference job ${job.id.slice(0, 8)} dibuat. Output akan muncul di panel Output.` : "Inference tidak dijalankan: gateway atau engine belum tersedia." }]);
          setTyping(false);
        });
      };

      const runTerm = () => {
        if (!termInput.trim()) return;
        const cmd = termInput.toLowerCase();
        let out = `> ${termInput}`;
        if (cmd.includes("clear")) {
          setTermLines(["Forge terminal ready"]);
          setTermInput("");
          notify("Terminal dibersihkan");
          return;
        }
        if (cmd.startsWith("inference")) { submitJob("inference", { model: activeModel }); out = "> inference job submitted"; }
        else if (cmd.startsWith("compile")) { submitJob("compile", { model: activeModel }); out = "> compile job submitted"; }
        else if (cmd.startsWith("train")) { submitJob("training", { model: activeModel }); out = "> training job submitted"; }
        else if (cmd.includes("ls")) { apiRequest("/api/files?path=.").then(data => setTermLines(l => [...l, `> ${data.files.map(f => f.name).join("  ") || "workspace kosong"}`])); out = "> listing workspace..."; }
        else out = "> command tidak memiliki adapter: gunakan inference, compile, train, ls, atau clear";
        setTermLines(l => [...l, out].slice(-80));
        setTermInput("");
        notify(`Command: ${termInput.slice(0, 30)}`);
      };

      const setWorkbench = (mode) => {
        setWorkbenchMode(mode);
        if (mode === "code") { setActivity("explorer"); setSidebarOpen(true); notify("Code workspace aktif"); }
        if (mode === "ai-engineering") { setActivity("ai-engineering"); setAiEngineeringTab("code"); setSidebarOpen(true); setAiPanelOpen(true); notify("AI Engineering workspace aktif"); }
        if (mode === "model") { setWorkbench("ai-engineering"); setAiEngineeringTab("models"); }
        if (mode === "training") { setWorkbench("ai-engineering"); setAiEngineeringTab("training"); setPanelTab("trainer"); }
        if (mode === "zip") { setActivity("explorer"); setSidebarOpen(true); notify("ZIP workspace aktif — pilih file ZIP"); }
      };
      const handleZipUpload = async (event) => {
        const file = event.target.files?.[0];
        event.target.value = "";
        if (!file) return;
        if (!window.JSZip) { notify("ZIP loader belum tersedia — buka aplikasi sekali dengan internet", "error"); return; }
        setBusy(`Membuka ${file.name}…`);
        try {
          const archive = await window.JSZip.loadAsync(file);
          archiveRef.current = archive;
          const entries = Object.values(archive.files).map(entry => ({ name: entry.name, dir: entry.dir, size: entry._data?.uncompressedSize || 0, zip: entry, classification: classifyPath(entry.name) }));
          setZipName(file.name);
          setZipEntries(entries);
          setZipGroup("all");
          showExplorer();
          notify(`${file.name} dibuka — ${entries.length} entry. Klik entry untuk mengedit.`, "success");
        } catch (error) { notify("ZIP tidak bisa dibaca atau rusak", "error"); } finally { setBusy(""); }
      };
      const openZipEntry = async (entry) => {
        if (entry.dir) return;
        try {
          const name = entry.name.split("/").pop() || entry.name;
          const ext = extOf(name);
          const id = `zip-${entry.name}`;
          const u8 = await entry.zip.async("uint8array");
          const rec = toRec(u8);
          const tab = rec.kind === "text"
            ? { id, source: "zip", zipEntry: entry.name, name, ext, content: rec.content, saved: rec.content, modified: false }
            : { id, source: "zip", zipEntry: entry.name, name, ext, binary: true, readOnly: true, saved: "", modified: false, content: `Entry biner di dalam ZIP.\nnama: ${entry.name}\nukuran: ${fmtSize(u8.length)}\n\nGunakan Unduh untuk menyimpan file ini, atau Ekstrak untuk memasukkan seluruh ZIP ke Explorer.` };
          setOpenTabs(tabs => tabs.find(t => t.id === id) ? tabs : [...tabs, tab]);
          setActiveTabId(id);
          if (isMobile()) setSidebarOpen(false);
        } catch { notify(`Gagal membaca ${entry.name}`, "error"); }
      };
      const startTraining = (recipe) => {
        setWorkbench("ai-engineering");
        setAiEngineeringTab("training");
        setPanelTab("trainer");
        setTermLines(lines => [...lines, `[Forge Trainer] ${recipe} submitted • model: ${activeModel}`]);
        submitJob("training", { recipe, model: activeModel, dataset: "workspace/dataset.jsonl" });
      };

      const openModelFolder = (modelName) => {
        const files = MODEL_FILES[modelName] || [];
        setOpenedModel(modelName);
        setSelectedModelFile(files[0]);
        setActiveModel(modelName);
        notify(`Folder model dibuka: ${modelName}`, "success");
      };
      const openModelFile = (file) => {
        setSelectedModelFile(file);
        const id = `model-${openedModel}-${file.name}`;
        if (!openTabs.find(t => t.id === id)) setOpenTabs(t => [...t, { id, source: "model", readOnly: true, name: file.name, content: file.content || "", saved: file.content || "", ext: file.name.split(".").pop(), modified: false }]);
        setActiveTabId(id);
        notify(`Membuka isi model: ${file.name}`, "success");
      };
      const modelFiles = MODEL_FILES[openedModel] || [];
      const renderModelBrowser = () => (
        <div className="model-browser">
          <div className="model-browser-header"><Icon.Folder open /><div><div className="model-browser-title">Model registry</div><div className="model-browser-path">Gateway-backed workspace</div></div></div>
          <div className="model-file-list">
            {modelFiles.length === 0 && <div style={{padding: "12px", color: "var(--muted-2)", fontSize: 10}}>Belum ada model terdaftar. Tambahkan model ke workspace atau scan melalui gateway.</div>}
            {modelFiles.map(file => <button key={file.name} className={`model-file-row ${selectedModelFile?.name === file.name ? "active" : ""}`} onClick={() => openModelFile(file)}><Icon.GGUF /><span>{file.name}</span><small>{file.size}</small></button>)}
          </div>
          <div className="model-browser-actions"><button onClick={() => notify(`${modelFiles.length} file model ditemukan`, "success")}>Scan folder</button><button className="primary" onClick={() => modelFiles[0] ? openModelFile(modelFiles[0]) : notify("Belum ada model terdaftar di workspace", "info")}>Buka isi model</button></div>
        </div>
      );

      const fileIcon = (file) => {
        if (file.type === "folder") return <Icon.Folder open={!!expanded[file.id]} />;
        if (file.name === "AndroidManifest.xml") return <Icon.XML />;
        if (file.ext === "kt") return <Icon.KT />;
        if (file.ext === "smali") return <Icon.Smali />;
        if (file.ext === "gguf") return <Icon.GGUF />;
        if (file.ext === "json") return <Icon.JSON />;
        if (file.ext === "py") return <Icon.PY />;
        if (file.ext === "js") return <Icon.JS />;
        if (file.ext === "ts") return <Icon.TS />;
        if (file.ext === "yaml" || file.ext === "yml") return <Icon.YAML />;
        if (file.ext === "zip") return <Icon.ZIP />;
        if (file.ext === "sh") return <Icon.SH />;
        if (file.ext === "cpp" || file.ext === "h" || file.ext === "hpp") return <Icon.CPP />;
        if (file.ext === "txt") return <Icon.TXT />;
        return <div style={{ width: 14, height: 14, borderRadius: 3, background: "#222225" }} />;
      };

      const tabIcon = (tab) => {
        const map = { kt: Icon.KT, json: Icon.JSON, gguf: Icon.GGUF, py: Icon.PY, js: Icon.JS, ts: Icon.TS, yaml: Icon.YAML, zip: Icon.ZIP, sh: Icon.SH, cpp: Icon.CPP, txt: Icon.TXT, smali: Icon.Smali, xml: Icon.XML };
        const C = map[tab.ext] || Icon.TXT;
        return <C />;
      };
      const renderTree = (nodes, depth = 0) =>
        nodes.map(node => (
          <div key={node.id}>
            <div
              className={`file-row ${activeTabId === node.id ? "active" : ""}`}
              style={{ paddingLeft: 8 + depth * 14 }}
              onClick={() => openFile(node)}
              onContextMenu={(e) => {
                e.preventDefault();

                  <div className="empty-state">
                    <div className="empty-icon"><CopilotLogo size={30} /></div>
                    <div style={{ fontSize: 16, fontWeight: 600, letterSpacing: "-0.02em" }}>Forge AI Engineering</div>
                    <div style={{ fontSize: 13, color: "#A1A1AA", marginTop: 8, maxWidth: 300, lineHeight: 1.5 }}>
                      Tidak ada file terbuka. Buka file, impor ZIP atau tempel kode untuk mulai mengedit.
                    </div>
                    <div className="empty-actions">
                      <button className="primary" onClick={() => fileInputRef.current?.click()}>Open File</button>
                      <button onClick={() => zipImportRef.current?.click()}>Import ZIP</button>
                      <button onClick={askImportCode}>Import Code</button>
                      <button onClick={() => askNewFile()}>New File</button>
                      <button onClick={() => folderInputRef.current?.click()}>Open Folder</button>
                      <button onClick={showExplorer}>Open Explorer</button>
                    </div>
                  </div>
                )}
              </div>

              {/* BOTTOM PANEL */}
              <div className={`panel ${panelCollapsed ? "collapsed" : ""}`}>
                <div className="panel-tabs">
                  {[
                    { id: "problems", label: "Problems", count: 2 },
                    { id: "output", label: "Output" },
                    { id: "terminal", label: "Terminal" },
                    { id: "inference", label: "Inference", dot: true },
                    { id: "trainer", label: "Trainer" },
                  ].map(t => (
                    <button
                      key={t.id}
                      className={`panel-tab ${panelTab === t.id ? "active" : ""}`}
                      onClick={() => {
                        setPanelTab(t.id);
                        setPanelCollapsed(false);
                        notify(`Panel ${t.label} aktif`);
                      }}
                    >
                      {t.label}
                      {t.count && <span className="panel-count">{t.count}</span>}
                      {t.dot && <span className="panel-dot" />}
                    </button>
                  ))}
                  <div style={{ marginLeft: "auto", display: "flex", gap: 4 }}>
                    <button className="icon-btn" style={{ width: 24, height: 24 }} onClick={() => {
                      setTermLines(["Forge terminal ready"]);
                      notify("Panel dibersihkan");
                    }}>Clear</button>
                    <button className="icon-btn" style={{ width: 24, height: 24 }} onClick={() => {
                      setPanelCollapsed(c => !c);
                      notify(panelCollapsed ? "Panel diperluas" : "Panel diciutkan");
                    }}>{panelCollapsed ? "▲" : "⌄"}</button>
                  </div>
                </div>
                {!panelCollapsed && (
                  <div className="panel-body">
                    {panelTab === "terminal" && (
                      <>
                        {termLines.map((line, i) => (
                          <div key={i} className="term-line">
                            {i > 0 && <span className="term-prompt">❯</span>}
                            {line}
                          </div>
                        ))}
                        <div className="term-input-row">
                          <span className="term-prompt">❯</span>
                          <input
                            ref={termRef}
                            className="term-input"
                            value={termInput}
                            onChange={e => setTermInput(e.target.value)}
                            onKeyDown={e => { if (e.key === "Enter") runTerm(); }}
                            placeholder="forge$ "
                          />
                        </div>
                      </>
                    )}
                    {panelTab === "problems" && (
                      <div>No diagnostics loaded. Connect a language server or open a workspace file.</div>
                    )}
                    {panelTab === "output" && (
                      <div>
                        [Forge Gateway] API adapter aktif<br/>
                        {activeJob ? `[${activeJob.type}] ${activeJob.status} • ${activeJob.progress}%` : "Tidak ada job aktif"}<br/>
                        {activeJob?.logs?.slice(-3).map((line, i) => <div key={i}>{line}</div>)}
                      </div>
                    )}
                    {panelTab === "inference" && (
                      <div>{activeJob?.type === "inference" ? `Inference job: ${activeJob.status} • ${activeJob.progress}%` : "No inference job active"}</div>
                    )}
                    {panelTab === "trainer" && (
                      <div>{activeJob?.type === "training" ? `Training job: ${activeJob.status} • ${activeJob.progress}%` : "No training job active"}</div>
                    )}
                  </div>
                )}
              </div>
            </div>

            {/* AI PANEL */}
            {(aiPanelOpen || window.innerWidth >= 1100) && (
              <>
                {aiPanelOpen && window.innerWidth < 1100 && (
                  <div className="ai-backdrop" onClick={() => { setAiPanelOpen(false); notify("Panel AI ditutup"); }} />
                )}
                <div className={`ai-panel ${aiPanelOpen ? "open" : ""}`} style={window.innerWidth >= 1100 ? { display: "flex" } : undefined}>
                  <div className="ai-header">
                    <button className="back-btn" onClick={() => {
                      setAiPanelOpen(false);
                      notify("Kembali dari panel AI");
                    }}>
                      <Icon.Back size={14} />
                      <span className="desktop-only">Kembali</span>
                    </button>
                    <CopilotLogo size={20} />
                    <span style={{ fontSize: 11, fontWeight: 600, letterSpacing: "0.04em", textTransform: "uppercase" }} className="desktop-only">
                      Forge AI
                    </span>
                    <span className="badge" style={{ marginLeft: "auto" }}>Gateway</span>
                  </div>

                  <div className="model-select">
                    <div style={{ fontSize: 11, letterSpacing: "0.05em", textTransform: "uppercase", color: "#71717B", fontWeight: 500, marginBottom: 8 }}>
                      Model • Quant • Compile
                    </div>
                    <button className="model-trigger" onClick={() => {
                      setModelDropdown(d => !d);
                      notify(modelDropdown ? "Dropdown model ditutup" : "Pilih model AI");
                    }}>
                      <span style={{ display: "flex", alignItems: "center", gap: 8 }}>
                        <span style={{ width: 7, height: 7, borderRadius: "50%", background: "#22C55E" }} />
                        {activeModel}
                      </span>
                      <svg width="12" height="12" viewBox="0 0 12 12" style={{ transform: modelDropdown ? "rotate(180deg)" : "none", transition: "0.2s" }}>
                        <path d="M2 4L6 8L10 4" stroke="currentColor" strokeWidth="1.2" strokeLinecap="round"/>
                      </svg>
                    </button>
                    {modelDropdown && (
                      <div className="model-dropdown">
                        {MODEL_LIST.map(m => (
                          <button key={m} className="model-option" onClick={() => {
                            setActiveModel(m);
                            setModelDropdown(false);
                            notify(`Model aktif: ${m}`, "success");
                          }}>
                            <span>{m}</span>
                            {activeModel === m && <span style={{ color: "#FF6A00" }}>✓</span>}
                          </button>
                        ))}
                      </div>
                    )}
                  </div>

                  {renderModelBrowser()}
                  {selectedModelFile && <div className="model-preview"><h4>Isi: {selectedModelFile.name}</h4><pre>{selectedModelFile.content}</pre></div>}
                  <div className="model-empty" style={{ margin: "0 12px 12px", padding: "12px", border: "1px dashed var(--border)", borderRadius: 8, color: "var(--muted-2)", fontSize: 10 }}>
                    Belum ada model terdaftar. Gunakan AI Engineering → Models untuk bekerja dengan model yang terdeteksi gateway.
                  </div>
                  <div className="chat-area">
                    {messages.map(msg => (
                      <div key={msg.id} className={`msg ${msg.role}`}>
                        {msg.role === "ai" && (
                          <div className="msg-avatar"><CopilotLogo size={14} /></div>
                        )}
                        <div className="msg-bubble">{msg.text}</div>
                      </div>
                    ))}
                    {typing && (
                      <div className="msg ai">
                        <div className="msg-avatar"><CopilotLogo size={14} /></div>
                        <div className="msg-bubble" style={{ color: "#71717B" }}>Copilot mengetik…</div>
                      </div>
                    )}
                  </div>

                  <div className="chat-input-area">
                    <div className="quick-cmds">
                      {["/explain", "/fix", "/inspect"].map(c => (
                        <button key={c} className="quick-cmd" onClick={() => {
                          setChatInput(c + " ");
                          notify(`Command ${c} siap`);
                        }}>{c}</button>
                      ))}
                    </div>
                    <div style={{ position: "relative" }}>
                      <textarea
                        className="chat-textarea"
                        rows={2}
                        value={chatInput}
                        onChange={e => setChatInput(e.target.value)}
                        onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } }}
                        placeholder="Tanya Forge AI… (Shift+Enter baris baru)"
                      />
                      <button className="chat-send" onClick={sendChat}>↑</button>
                    </div>
                    <div className="chat-meta">
                      <span style={{ display: "flex", alignItems: "center", gap: 4 }}>
                        <span style={{ width: 5, height: 5, borderRadius: "50%", background: systemStatus?.unavailable ? "#FACC15" : "#22C55E" }} />
                        {systemStatus?.unavailable ? "Gateway offline" : activeJob ? `${activeJob.type} ${activeJob.status}` : "Gateway ready"}
                      </span>
                      <span>•</span>
                      <span>On-device inference</span>
                    </div>
                  </div>
                </div>
              </>
            )}
          </div>

          {/* STATUS BAR */}
          <div className="statusbar">
            <button className="status-item" onClick={() => notify("Branch: main • klik untuk ganti branch")}>
              <Icon.Git active={false} /> No repository
            </button>
            <span className="status-item" style={{ cursor: "default" }}>
              <span style={{ width: 6, height: 6, borderRadius: "50%", background: systemStatus?.unavailable ? "#FACC15" : "#22C55E" }} /> {systemStatus?.unavailable ? "Gateway offline" : "Workspace ready"}
            </span>
            <button className="status-item" onClick={() => { setPanelTab("problems"); setPanelCollapsed(false); notify("Diagnostics panel dibuka"); }}>
              <span style={{ color: "#FACC15" }}>⚠</span> Diagnostics
              <span style={{ color: "#EF4444", marginLeft: 4 }}>✕</span> 1
            </button>
            <div style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 8 }}>
              <button className="status-item" onClick={() => notify("Device: Pixel 8 • forge")}>
                📱 Pixel 8
              </button>
              <button className="status-item" onClick={() => { setPanelTab("output"); setPanelCollapsed(false); }}>
                <Icon.AI size={12} /> {activeJob ? `${activeJob.type}: ${activeJob.status}` : "No active job"}
              </button>
              <span className="status-item desktop-only" style={{ cursor: "default" }}>UTF-8 • Kotlin</span>
            </div>
          </div>

          {/* MOBILE FABs */}
          {!sidebarOpen && (
            <button className="fab fab-explorer mobile-only" aria-label="Buka Explorer" title="Buka Explorer" onClick={() => {
              setSidebarOpen(true);
              setActivity("explorer");
              notify("Explorer dibuka");
            }}>
              <Icon.Explorer active /><span className="explorer-fab-label">Buka Explorer</span>
            </button>
          )}
          <button className="fab fab-ai" style={{ display: window.innerWidth < 1100 ? "flex" : "none" }} onClick={() => {
            setAiPanelOpen(v => !v);
            notify(aiPanelOpen ? "Panel AI ditutup" : "Panel AI dibuka");
          }}>
            <CopilotLogo size={20} />
          </button>

          {/* COMMAND PALETTE */}
          {paletteOpen && (
            <div className="palette-overlay" onClick={() => setPaletteOpen(false)}>
              <div className="palette" onClick={e => e.stopPropagation()}>
                <div className="palette-input-row">
                  <svg width="16" height="16" viewBox="0 0 16 16" style={{ color: "#71717B" }}>
                    <circle cx="7" cy="7" r="5" stroke="currentColor" strokeWidth="1.4"/>
                    <path d="M11 11L14 14" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
                  </svg>
                  <input
                    className="palette-input"
                    autoFocus
                    value={paletteQuery}
                    onChange={e => setPaletteQuery(e.target.value)}
                    placeholder="Cari command… (GGUF, llama, tokenizer, compile, train)"
                  />
                  <span className="kbd">ESC</span>
                </div>
                <div className="palette-list">
                  {commands.map(c => (
                    <button key={c.id} className="palette-item" onClick={() => {
                      c.action();
                      setPaletteOpen(false);
                      setPaletteQuery("");
                    }}>
                      <div className="palette-item-icon"><Icon.AI size={14} /></div>
                      <span style={{ fontSize: 13 }}>{c.label}</span>
                    </button>
                  ))}
                  {commands.length === 0 && (
                    <div style={{ padding: "24px 16px", textAlign: "center", fontSize: 12, color: "#71717B" }}>
                      Tidak ada command yang cocok
                    </div>
                  )}
                </div>
                <div className="palette-footer">
                  <span><span className="kbd">↑↓</span> Navigate</span>
                  <span><span className="kbd">↵</span> Select</span>
                  <span style={{ marginLeft: "auto", display: "flex", alignItems: "center", gap: 4 }}>
                    <Icon.AI size={12} /> Forge palette
                  </span>
                </div>
              </div>
            </div>
          )}

          {/* CONTEXT MENU */}
          {ctxMenu && (() => {
            const node = ctxMenu.node;
            const isFolder = node.type === "folder";
            const items = isFolder
              ? [["File baru di sini", () => askNewFile(node.path)], ["Folder baru di sini", () => askNewFolder(node.path)], ["Rename / pindah", () => askRename(node)], ["Salin path", () => copyPath(node.path)], ["Unduh sebagai ZIP", () => exportZip(node.path)], ["Hapus", () => askDelete(node), true]]
              : [["Buka", () => openWsFile(node.path)], ["Rename / pindah", () => askRename(node)], ["Salin path", () => copyPath(node.path)], ["Unduh file", () => { const rec = wsRef.current.files[node.path]; if (rec) saveBlob(node.name, new Blob([rec.kind === "text" ? ((openTabs.find(t => t.id === node.id) || {}).content ?? rec.content) : rec.data])); }], ["Hapus", () => askDelete(node), true]];
            return (
              <>
                <div className="ctx-backdrop" onClick={() => setCtxMenu(null)} onContextMenu={(e) => { e.preventDefault(); setCtxMenu(null); }} />
                <div className="ctx-menu" style={{ left: ctxMenu.x, top: ctxMenu.y }}>
                  <div className="ctx-label">{node.path}</div>
                  {items.map(([label, run, danger]) => (
                    <button key={label} className="ctx-item" style={danger ? { color: "#FCA5A5" } : undefined} onClick={() => { setCtxMenu(null); run(); }}>{label}</button>
                  ))}
                </div>
              </>
            );
          })()}

          {/* FILE MENU */}
          {fileMenu && (() => {
            const close = (fn) => () => { setFileMenu(false); fn(); };
            const rows = [
              ["Open File…", "Ctrl+O", () => fileInputRef.current?.click()],
              ["Open Folder…", "", () => folderInputRef.current?.click()],
              ["Import ZIP ke Workspace…", "", () => zipImportRef.current?.click()],
              ["Import Code (tempel)…", "", askImportCode],
              ["New File…", "", () => askNewFile()],
              ["New Folder…", "", () => askNewFolder()],
              null,
              ["Save", "Ctrl+S", saveActive],
              ["Save All", "Ctrl+Shift+S", saveAll],
              ["Unduh file aktif (Save As)", "", () => downloadTab(activeTab)],
              ["Export Workspace → ZIP", "", () => exportZip()],
              null,
              ["Bongkar ZIP (lihat & edit isi)…", "", () => { setWorkbench("zip"); zipInputRef.current?.click(); }],
              ["Kosongkan Workspace…", "", askClearWorkspace, true],
            ];
            return (
              <>
                <div className="fm-backdrop" onClick={() => setFileMenu(false)} />
                <div className="file-menu">
                  {rows.map((r, i) => r === null ? <div key={i} className="fm-sep" /> : (
                    <button key={r[0]} className={`fm-item ${r[3] ? "danger" : ""}`} onClick={close(r[2])}><span>{r[0]}</span><small>{r[1]}</small></button>
                  ))}
                </div>
              </>
            );
          })()}

          {/* DIALOG */}
          {dialog && (
            <div className="dlg-overlay" onClick={() => setDialog(null)}>
              <form className="dlg" onClick={e => e.stopPropagation()} onSubmit={async (e) => {
                e.preventDefault();
                const ok = await dialog.onSubmit(dialog.values || {});
                if (ok !== false) setDialog(null);
              }}>
                <h3>{dialog.title}</h3>
                {dialog.message && <p>{dialog.message}</p>}
                {(dialog.fields || []).map((f, i) => (
                  <div key={f.key}>
                    <label htmlFor={`dlg-${f.key}`}>{f.label}</label>
                    {f.type === "textarea"
                      ? <textarea id={`dlg-${f.key}`} spellCheck="false" placeholder={f.placeholder} value={dialog.values[f.key] || ""} onChange={e => { const v = e.target.value; setDialog(d => ({ ...d, values: { ...d.values, [f.key]: v } })); }} />
                      : <input id={`dlg-${f.key}`} type="text" autoFocus={i === 0} autoComplete="off" autoCapitalize="off" spellCheck="false" placeholder={f.placeholder} value={dialog.values[f.key] || ""} onChange={e => { const v = e.target.value; setDialog(d => ({ ...d, values: { ...d.values, [f.key]: v } })); }} />}
                  </div>
                ))}
                <div className="dlg-actions">
                  {(dialog.extras || []).map(x => (
                    <button key={x.label} type="button" className={x.danger ? "danger" : ""} onClick={() => { x.onClick(); if (!x.keepOpen) setDialog(null); }}>{x.label}</button>
                  ))}
                  <button type="button" onClick={() => setDialog(null)}>Batal</button>
                  <button type="submit" className={dialog.danger ? "danger" : "primary"}>{dialog.submitLabel || "OK"}</button>
                </div>
              </form>
            </div>
          )}

          {busy && <div className="busy-banner">{busy}</div>}

          {/* input file tersembunyi untuk Open File / Open Folder / Import ZIP / Bongkar ZIP */}
          <input ref={fileInputRef} type="file" multiple onChange={handleOpenFiles} style={{ display: "none" }} />
          <input ref={folderInputRef} type="file" multiple webkitdirectory="" directory="" onChange={handleOpenFolder} style={{ display: "none" }} />
          <input ref={zipImportRef} type="file" accept=".zip,application/zip,application/x-zip-compressed" onChange={handleImportZip} style={{ display: "none" }} />
          <input ref={zipInputRef} type="file" accept=".zip,application/zip,application/x-zip-compressed" onChange={handleZipUpload} style={{ display: "none" }} />

          {/* TOASTS */}
          <div className="toasts">
            {toasts.map(t => (
              <div key={t.id} className={`toast ${t.type}`}>
                <div className="toast-icon">
                  {t.type === "success" ? "✓" : t.type === "error" ? "✕" : "•"}
                </div>
                <span>{t.msg}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
