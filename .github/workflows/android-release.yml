name: Android release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'
          host: 'linux'
          target: 'android'
          arch: 'android_arm64_v8a'
          cache: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install and pin Android SDK 34
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          set -o pipefail
          for platform in "$SDK_ROOT"/platforms/android-*; do
            [ -d "$platform" ] || continue
            if [ "${platform##*/}" != "android-34" ]; then rm -rf "$platform"; fi
          done

      - name: Configure Android build
        working-directory: forge-workbench/native-qt6
        run: |
          qt-cmake -S . -B build -DQT_ANDROID_ABIS=arm64-v8a

      - name: Build APK
        working-directory: forge-workbench/native-qt6
        run: cmake --build build --parallel 2

      - name: Locate and checksum APK
        id: artifact
        working-directory: forge-workbench/native-qt6
        run: |
          APK=$(find build -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" ForgeWorkbench-${GITHUB_REF_NAME#v}.apk
          sha256sum ForgeWorkbench-${GITHUB_REF_NAME#v}.apk | tee ForgeWorkbench-${GITHUB_REF_NAME#v}.apk.sha256
          echo "apk=ForgeWorkbench-${GITHUB_REF_NAME#v}.apk" >> "$GITHUB_OUTPUT"
          echo "sha=ForgeWorkbench-${GITHUB_REF_NAME#v}.apk.sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            forge-workbench/native-qt6/ForgeWorkbench-*.apk
            forge-workbench/native-qt6/ForgeWorkbench-*.apk.sha256
